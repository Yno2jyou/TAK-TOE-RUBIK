<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<script>
const PLACE_COST=10;  // 配置1回の回転予算コスト
const PLAN_BONUS=900; // ライン作りの経路の一手目に与える加点

'use strict';
/* モバイル: キーボードが出ても入力欄が隠れないよう、タイトル画面を可視領域に合わせる */
(function(){
  const t=document.getElementById('title');
  const vv=window.visualViewport;
  if(!t||!vv)return;
  const keepFocusVisible=()=>{
    const a=document.activeElement;
    if(a&&(a.id==='roomInput'||a.id==='nickInput'))a.scrollIntoView({block:'center'});
  };
  const fit=()=>{t.style.top=vv.offsetTop+'px';t.style.height=vv.height+'px';keepFocusVisible()};
  vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);fit();
  ['roomInput','nickInput'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('focus',()=>setTimeout(()=>el.scrollIntoView({block:'center'}),350));
  });
})();
/* =====================================================
   PART 1 : GAME LOGIC  (no drawing here)
   A cell = ONE square (sticker) on the outside of the cube. 54 cells.
   slot = face*9 + row*3 + col   (face = axis*2 + (plus?0:1))
   owner: 0 empty / 1 YOU (O) / 2 CPU (X)
   Lines = 3 squares in a straight row on one face (rows, columns, diagonals).
   Turning a slice moves the squares (and their marks) to new slots.
   ===================================================== */
const AX=[[1,0,0],[0,1,0],[0,0,1]];
const IDX=(x,y,z)=>(x+1)+3*(y+1)+9*(z+1);
const POS=[];
for(let z=-1;z<=1;z++)for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++)POS[IDX(x,y,z)]=[x,y,z];
const NCELL=54;

/* matrices (row-major 3x3) */
function rotM(axis,th){
  const c=Math.cos(th),s=Math.sin(th),t=1-c,[x,y,z]=AX[axis];
  return [t*x*x+c,t*x*y-s*z,t*x*z+s*y, t*x*y+s*z,t*y*y+c,t*y*z-s*x, t*x*z-s*y,t*y*z+s*x,t*z*z+c];
}
const mulV=(M,v)=>[M[0]*v[0]+M[1]*v[1]+M[2]*v[2],M[3]*v[0]+M[4]*v[1]+M[5]*v[2],M[6]*v[0]+M[7]*v[1]+M[8]*v[2]];
function mulM(A,B){const r=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++)r.push(A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j]);return r}
const rnd=a=>a.map(v=>{const r=Math.round(v);return r===0?0:r});

/* slot of a square sitting on cubie position p, facing direction n */
function slotOf(p,n){
  const ni=n.findIndex(v=>v!==0),f=ni*2+(n[ni]>0?0:1),a=(ni+1)%3,b=(ni+2)%3;
  return f*9+(p[a]+1)*3+(p[b]+1);
}
const SLOT=[];
for(const p of POS)for(let ax=0;ax<3;ax++)if(p[ax]!==0){
  const n=[0,0,0];n[ax]=p[ax];SLOT[slotOf(p,n)]={p,n};
}

/* winning lines: 8 per face (3 rows, 3 columns, 2 diagonals) x 6 faces = 48 */
const LINES=(()=>{
  const g=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],out=[];
  for(let f=0;f<6;f++)for(const l of g)out.push(l.map(i=>f*9+i));
  return out;
})();
const LINE_COUNT=new Array(NCELL).fill(0);
LINES.forEach(l=>l.forEach(i=>LINE_COUNT[i]++));

/* all 18 turns: 3 axes x 3 slices x 2 directions (dir*90deg, right-hand rule) */
const ROTS=[];
for(let axis=0;axis<3;axis++)for(let layer=-1;layer<=1;layer++)for(const dir of [1,-1]){
  const R=rotM(axis,dir*Math.PI/2),perm=[];
  for(let s=0;s<NCELL;s++){
    const {p,n}=SLOT[s];
    perm[s]=p[axis]===layer?slotOf(rnd(mulV(R,p)),rnd(mulV(R,n))):s;
  }
  ROTS.push({axis,layer,dir,perm});
}
function rotBoard(b,r){const nb=b.slice();for(let i=0;i<NCELL;i++)nb[r.perm[i]]=b[i];return nb}

function lineOwners(b){
  let p=false,c=false;
  for(const l of LINES){
    const a=b[l[0]];
    if(a&&a===b[l[1]]&&a===b[l[2]]){if(a===1)p=true;else c=true}
  }
  return {p,c};
}
/* result after a move: 'P' you win / 'C' cpu wins / 'D' draw / null continue.
   (a turn that makes lines for both sides = draw) */
function outcome(b){
  const {p,c}=lineOwners(b);
  if(p&&c)return 'D';
  if(p)return 'P';
  if(c)return 'C';
  for(let i=0;i<NCELL;i++)if(b[i]===0)return null;
  return 'D';
}
function genMoves(b,allowMark=true,allowRot=true){
  const ms=[];
  if(allowMark)for(let i=0;i<NCELL;i++)if(b[i]===0)ms.push({type:'mark',i});
  if(allowRot)for(let r=0;r<ROTS.length;r++)ms.push({type:'rot',r});
  return ms;
}
function applyMove(b,m,who){
  if(m.type==='mark'){const nb=b.slice();nb[m.i]=who;return nb}
  return rotBoard(b,ROTS[m.r]);
}

/* =====================================================
   PART 2 : CPU (pure, see chooseIter)
   ===================================================== */
const LEVELS={
  EASY:   {depth:2, noise:0.8,  cap:54, W:{mark:10,rot:18}, budgetMs:0,    mistakesPerGame:0},
  NORMAL: {depth:3, noise:0.15, cap:54, W:{mark:6,rot:12},  budgetMs:2000, mistakesPerGame:0},
  HARD:   {depth:6, noise:0.3,    cap:54, W:{mark:8,rot:12},  budgetMs:1200, mistakesPerGame:0}
};
let mistakesLeft=0;
/* ===== CPU ENGINE (刷新版: 回転=予算, マーク=ライン完成で獲得, 完成ライン数で判定) ===== */
const COST={rot:1};
const POOL_START=30;
const ROT_PEN=150;
const ROT_TEMPO=150;   // 同じ評価なら回転の少ない手を選ぶための減点(ターン内の回転数に比例)
function countThreats(b,who){
  let n=0;
  for(const l of LINES){
    let mine=0,empty=0,other=0;
    for(const i of l){ if(b[i]===who)mine++; else if(b[i]===0)empty++; else other++; }
    if(mine===2&&empty===1&&other===0)n++;
  }
  return n;
}
/* 現在成立しているラインだけを返す(累計ではない) */
function addLines(ls,b){
  const n=[new Uint8Array(LINES.length),new Uint8Array(LINES.length)];
  for(let k=0;k<LINES.length;k++){
    const l=LINES[k],a=b[l[0]];
    if((a===1||a===2)&&b[l[1]]===a&&b[l[2]]===a)n[a-1][k]=1;
  }
  return n;
}
/* 盤面で今成立している、その陣営のライン数 */
function boardLines(b,who){let c=0;for(const l of LINES)if(b[l[0]]===who&&b[l[1]]===who&&b[l[2]]===who)c++;return c}
function lineN(u){let c=0;for(let i=0;i<u.length;i++)c+=u[i];return c}
/* 駒数: [先手(1)の駒数, 後手(2)の駒数] */
function stoneCountsOf(b){let a=0,c=0;for(const x of b){if(x===1)a++;else if(x===2)c++}return [a,c]}
/* 終局評価: 駒の多い方が勝ち(CPU=2の視点で正の値が有利) */
function finalValue(b){const [a,c]=stoneCountsOf(b);return 1000*(c-a)}
function openLines(b,who){
  let n=0;
  for(const l of LINES){
    let mine=0,opp=0;
    for(const i of l){ if(b[i]===who)mine++; else if(b[i]!==0)opp++; }
    if(mine>0&&opp===0)n++;
  }
  return n;
}
/* 回転の罰則: 盤面の評価(完成ライン・リーチ・見込み)が良くなる回転は罰則なし。
   何も進まない回転だけ罰則を付ける。複数回転でも、ライン完成や作る道筋があれば許可 */
function rotPen(b,ls,nb,kl,side){
  const d=leafEval(nb,kl)-leafEval(b,ls);
  const good=side===2?d>0:d<0;
  return good?0:(side===2?-ROT_PEN:ROT_PEN);
}
/* 盤面評価(CPU=2の視点で正が有利)。駒差を主軸に、ラインはマーク権として加点する。
   相手のラインは自分の駒が奪われる脅威なので減点 → 防ぐだけでなく、自分のマークを狙う動機になる */
/* MARK権の見込み: 今持っている権利 + このターン中に新しく作ったライン(ターン終了時に累積される) */
function markProspect(ls,who){
  const ms=(typeof markStock!=='undefined')?markStock:[0,0,0];
  const ts=(typeof turnStart!=='undefined')?turnStart:[null,[],[]];
  const base=ts[who]||[];
  let n=0;
  for(let k=0;k<LINES.length;k++)if(ls[who-1][k]&&!base.includes(k))n++;
  return ms[who]+n;
}
function leafEval(b,ls){
  // 攻め重視: 自分のラインは大きく加点、相手のラインは小さく減点。
  // MARK権の差を大きく評価し、相手が権利を持てばCPUも権利を取り返しにいく
  const [a,c]=stoneCountsOf(b);
  return 300*(c-a)
    +400*lineN(ls[1])-150*lineN(ls[0])
    +600*(markProspect(ls,2)-markProspect(ls,1))
    +100*countThreats(b,2)-30*countThreats(b,1)
    +80*openLines(b,2)-20*openLines(b,1);
}
function winCells(b,who){
  const out=[];
  for(const l of LINES){
    let w=0,e=-1,o=false;
    for(const i of l){ if(b[i]===who)w++; else if(b[i]===0)e=i; else o=true; }
    if(w===2&&e>=0&&!o)out.push(e);
  }
  return out;
}
/* Q=[_,先手の残予算,後手の残予算](回転予算) */
function affinity(b,i,side){
  let n=0;
  for(const l of LINES){if(!l.includes(i))continue;for(const j of l)if(b[j]===side)n++;}
  return n;
}
/* 相手のリーチ(相手2つ+空き1)に含まれるiの数 */
function breaks(b,i,opp){
  let n=0;
  for(const l of LINES){
    if(!l.includes(i))continue;
    let o=0,e=0,m=0;for(const j of l){if(b[j]===opp)o++;else if(b[j]===0)e++;else m++}
    if(o===2&&e===1&&m===0)n++;
  }
  return n;
}
/* この石を相手が自分のラインの一部として守っているか(相手が揃えた線に含まれる駒は奪えない) */
function protectedStone(b,i,who){return LINES.some(l=>l.includes(i)&&l.every(x=>b[x]===who))}
/* 回転1回でラインまたはリーチ(あと1で揃う形)を作れるか */
/* 回転を最大maxRot回まで重ねて、ラインを作れるか。
   幅広いビーム探索(各段で有望な盤面を最大40件残し、同じ盤面は1回だけ展開)。結果はキャッシュする */
let REACH_CACHE=new Map();
/* 回転を最大maxRot回まで重ねて、ラインを作れるかを探す(ビーム探索)。
   見つかったら、その経路の最初の一手(ROTSの添字)も返す。結果はキャッシュする */
function lineReachPlan(b,side,maxRot){
  const key=side+':'+maxRot+':'+b.join('');
  if(REACH_CACHE.has(key))return REACH_CACHE.get(key);
  const base=boardLines(b,side);
  let beam=[{nb:b,first:-1}];
  let res={found:false,first:-1};
  search:
  for(let step=0;step<maxRot;step++){
    const cand=new Map();
    for(const st of beam)for(let r=0;r<ROTS.length;r++){
      const nb=rotBoard(st.nb,ROTS[r]);
      const first=st.first<0?r:st.first;
      if(boardLines(nb,side)>base){res={found:true,first};break search}
      const k=nb.join('');
      if(!cand.has(k))cand.set(k,{nb,first,score:countThreats(nb,side)*100-countThreats(nb,3-side)*60+openLines(nb,side)*40});
    }
    beam=[...cand.values()].sort((x,y)=>y.score-x.score).slice(0,40);
    if(!beam.length)break;
  }
  REACH_CACHE.set(key,res);
  return res;
}
function lineReachable(b,side,maxRot){return lineReachPlan(b,side,maxRot).found}
function rotationCanReach(b,side){
  const t0=countThreats(b,side),l0=boardLines(b,side);
  for(const r of ROTS){
    const nb=rotBoard(b,r);
    if(boardLines(nb,side)>l0||countThreats(nb,side)>t0)return true;
  }
  return false;
}
function kidsOf(b,side,Q,rt,cap,W,win,markOK){
  const kids=[];
  // マーク: 自分の操作で今ラインが揃った直後だけ使える(ターンを終える)。守られていない相手の駒を奪う
  if(markOK){
    const arr=[];
    for(let i=0;i<NCELL;i++)if(b[i]===3-side)
      arr.push({i,pre:affinity(b,i,side)*10+breaks(b,i,3-side)*50});
    arr.sort((x,y)=>y.pre-x.pre||x.i-y.i);
    for(const c of arr.slice(0,W.mark)){const nb=b.slice();nb[c.i]=side;kids.push({t:0,i:c.i,nb});}
  }
  // 配置: ターンの最初の操作として空いている所に自分の駒を置く(置いて揃えば、その直後にMARKか終了)
  if(!win&&rt===0&&Q[side]>=PLACE_COST&&(side!==2||!lineReachable(b,side,10))){
    const emp=[];
    for(let i=0;i<NCELL;i++)if(b[i]===0){
      const nb=b.slice();nb[i]=side;
      const lineNow=boardLines(nb,side)>boardLines(b,side)?1:0;
      const reachNow=countThreats(nb,side)>countThreats(b,side)?1:0;
      emp.push({i,pre:lineNow*100000+reachNow*10000+affinity(b,i,side)*10+breaks(b,i,3-side)*50});
    }
    emp.sort((x,y)=>y.pre-x.pre||x.i-y.i);
    for(const c of emp.slice(0,W.place||12)){const nb=b.slice();nb[c.i]=side;kids.push({t:2,i:c.i,nb});}
  }
  if(!win&&Q[side]>=COST.rot&&rt<cap){
    for(let r=0;r<ROTS.length;r++){
      const nb=rotBoard(b,ROTS[r]);
      if(nb.every((v,i)=>v===b[i]))continue;
      kids.push({t:1,r,nb});
    }
  }
  return kids;
}
const ABORT={};
const SRCH={dl:Infinity,n:0};
/* 駒数: [先手(1)の駒数, 後手(2)の駒数] */
function stoneCountsOf(b){let a=0,c=0;for(const x of b){if(x===1)a++;else if(x===2)c++}return [a,c]}
/* 終局評価: 駒の多い方が勝ち(CPU=2の視点で正が有利) */
function finalValue(b){const [a,c]=stoneCountsOf(b);return 1000*(c-a)}
/* 配置/マーク/回転の子ノード。配置・回転で揃った場合は同じ側の手番が続く(win=true) */
function childOf(k,side,Q,rt,depth,alpha,beta,P){
  if(k.t===0)return sMinimax(k.nb,3-side,Q,0,depth-1,alpha,beta,P,k.ls,false);
  if(k.t===2){const Q3=Q.slice();Q3[side]-=PLACE_COST;return sMinimax(k.nb,3-side,Q3,0,depth-1,alpha,beta,P,k.ls,false)}
  const Q2=Q.slice();Q2[side]-=COST.rot;
  return sMinimax(k.nb,side,Q2,rt+1,depth-1,alpha,beta,P,k.ls,k.win)+k.pen;
}
function sMinimax(b,side,Q,rt,depth,alpha,beta,P,ls,win){
  if((++SRCH.n&127)===0&&Date.now()>SRCH.dl)throw ABORT;
  {const [a,c]=stoneCountsOf(b);
   if(a<=2||c<=2){const v=(a<=2&&c<=2)?finalValue(b):(a<=2?-1e6:1e6);return v+depth*0.001}}
  if(Q[1]<=0&&Q[2]<=0)return finalValue(b)+depth*0.001;
  if(depth<=0)return leafEval(b,ls);
  const maxing=side===2;
  let kids=kidsOf(b,side,Q,rt,P.cap,P.W,win,false);
  for(const k of kids){
    k.ls=k.t===0?addLines(ls,k.nb):ls;
    k.pen=k.t===1?rotPen(b,ls,k.nb,k.ls,side):0;
    k.win=k.t===1&&boardLines(k.nb,side)>boardLines(b,side);   // 回転で揃った(以後この手番は回転不可)
    k.v=leafEval(k.nb,k.ls)+k.pen;
  }
  kids.sort((x,y)=>maxing?y.v-x.v:x.v-y.v);
  let rots=0;kids=kids.filter(k=>k.t!==1||(++rots<=P.W.rot));
  let best=maxing?-Infinity:Infinity;
  for(const k of kids){
    const v=childOf(k,side,Q,rt,depth,alpha,beta,P);
    if(maxing){if(v>best)best=v;if(best>alpha)alpha=best;}
    else{if(v<best)best=v;if(best<beta)beta=best;}
    if(beta<=alpha)break;
  }
  if(rt>0&&beta>alpha){
    const kl=addLines(ls,b);
    const v=sMinimax(b,3-side,Q,0,depth-1,alpha,beta,P,kl,false);
    if(maxing){if(v>best)best=v;}else{if(v<best)best=v;}
  }
  if(best===Infinity||best===-Infinity)return leafEval(b,ls);
  return best;
}
function chooseAction(b,me,Q,rt,P,rng,ls,win,markOK){
  const RW={mark:NCELL,rot:ROTS.length,place:12};
  const opt=[];
  const plan=(me===2&&!win)?lineReachPlan(b,2,10):{found:false,first:-1};
  for(const k of kidsOf(b,me,Q,rt,P.cap,RW,win,markOK)){
    k.ls=k.t===0?addLines(ls,k.nb):ls;
    k.win=k.t===1&&boardLines(k.nb,me)>boardLines(b,me);
    k.pen=k.t===1?rotPen(b,ls,k.nb,k.ls,me):0;
    let v=childOf(k,me,Q,rt,P.depth,-Infinity,Infinity,P);
    if(k.t===1)v-=(me===2?1:-1)*ROT_TEMPO*(rt+1);   // 評価の符号(陣営)に合わせて減点
    if(k.t===1&&plan.found&&k.r===plan.first)v+=PLAN_BONUS;   // 10回以内でライン化できる経路を優先
    const act=k.t===0?{type:'mark',i:k.i}:k.t===2?{type:'place',i:k.i}:{type:'rot',r:k.r};
    opt.push({a:act,v,t:k.t});
  }
  if(rt>0){
    const kl=addLines(ls,b);
    const v=sMinimax(b,3-me,Q,0,P.depth-1,-Infinity,Infinity,P,kl,false);
    opt.push({a:{type:'end'},v,t:3});
  }
  if(!opt.length)return {type:'end'};
  const sg=me===2?1:-1;
  for(const o of opt)o.score=sg*o.v+(P.noise?P.noise*rng():0);
  opt.sort((x,y)=>y.score-x.score||(x.t-y.t));
  return opt[0].a;
}
function chooseIter(b,me,Q,rt,P,rng,ls,win,markOK){
  REACH_CACHE=new Map();
  if(!ls)ls=addLines([new Uint8Array(LINES.length),new Uint8Array(LINES.length)],b);
  let best=null;
  SRCH.dl=P.budgetMs?Date.now()+P.budgetMs:Infinity;
  for(let d=1;d<=P.depth;d++){
    try{best=chooseAction(b,me,Q,rt,Object.assign({},P,{depth:d}),rng,ls,!!win,!!markOK)}
    catch(e){if(e===ABORT)break;throw e}
  }
  return best||{type:'end'};
}

function seededRng(seed){
  let a=seed>>>0;
  return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296};

function placeStones(){
  const all=cubies.flatMap(c=>c.st);
  // 面の中央(その面の色を1つだけ持つステッカー)かどうか
  const isCtr=cubies.flatMap(c=>c.st.map(()=>c.st.length===1));
  const rng=stoneSeed===null?Math.random:seededRng(stoneSeed);
  const swap=playMode==='pvp'&&!isHost;   // 表示上の「1=自分」に合わせ、ゲスト側は所有者を入れ替える
  const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  for(let tries=0;tries<1000;tries++){
    all.forEach(st=>{st.owner=0;st.mt=-1});
    const ctr=shuf(all.map((_,i)=>i).filter(i=>isCtr[i]));
    const rest=shuf(all.map((_,i)=>i).filter(i=>!isCtr[i]));
    // 各陣営の4個に、中央を必ず1つ含める(残りはランダム。3個以下では即負けになるため4個から開始)
    const pickA=[ctr[0]],pickB=[ctr[1]];
    const pool=shuf([...ctr.slice(2),...rest]);
    pickA.push(...pool.splice(0,3));
    pickB.push(...pool.splice(0,3));
    const A=swap?2:1,B=swap?1:2;
    pickA.forEach(i=>all[i].owner=A);
    pickB.forEach(i=>all[i].owner=B);
    if(!scanCompleteLine())break;
  }
  all.forEach(st=>{st.mt=-1});
}

/* free view: a rotation matrix we turn around the screen axes (no limits) */
function orth(M){
  const nz=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l]};
  let a=nz([M[0],M[1],M[2]]),b=[M[3],M[4],M[5]];
  const d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  b=nz([b[0]-d*a[0],b[1]-d*a[1],b[2]-d*a[2]]);
  const c=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  return [...a,...b,...c];
}

function followCam(dt){
  if(!camGoal&&pendingGoal&&performance.now()>=camHold){camGoal=pendingGoal;pendingGoal=null}
  if(!camGoal)return;
  const c=[userView[6],userView[7],userView[8]];
  const k=1-Math.exp(-dt*camRate);
  let nc=[c[0]+(camGoal[0]-c[0])*k,c[1]+(camGoal[1]-c[1])*k,c[2]+(camGoal[2]-c[2])*k];
  const nl=Math.hypot(nc[0],nc[1],nc[2])||1;
  nc=nc.map(v=>v/nl);
  const a0=[userView[0],userView[1],userView[2]];
  const dd=a0[0]*nc[0]+a0[1]*nc[1]+a0[2]*nc[2];
  const a=[a0[0]-dd*nc[0],a0[1]-dd*nc[1],a0[2]-dd*nc[2]];
  const al=Math.hypot(a[0],a[1],a[2])||1;

function myTag(){return playMode==='pvp'?(myName()||(isHost?'PLAYER 1':'PLAYER 2')):'YOU'}
function oppTag(){return playMode==='pvp'?(oppName||(isHost?'PLAYER 2':'PLAYER 1')):'CPU'}
function netSend(msg){
  if(conn&&conn.open){try{conn.send(msg)}catch(e){console.warn('send',e)}}
}
function netDestroy(){
  netStarted=false;startSent=false;
  try{if(conn){conn.close()}}catch(e){}
  conn=null;
  try{if(peer){peer.destroy()}}catch(e){}
  peer=null;isHost=false;roomCode='';
}
function setNetWait(show,msg,code){
  const el=document.getElementById('netwait');
  if(!el)return;
  el.classList.toggle('hidden',!show);
  if(msg!=null){const m=document.getElementById('netMsg');if(m)m.textContent=msg}
  if(code!=null){const c=document.getElementById('netCode');if(c)c.textContent=code}
}
function whenOpen(c,fn){
  let done=false;
  const go=()=>{if(done)return;done=true;try{fn()}catch(e){console.error(e)}};
  if(c.open)go();
  else c.on('open',go);
}
function wireConn(c){
  conn=c;
  c.on('data',onNetData);
  c.on('close',()=>{
    if(state!=='title'&&state!=='over'){
      setNetWait(true,'DISCONNECTED','');
      setTimeout(()=>{setNetWait(false);toTitle()},1200);
    }else if(!netStarted&&isHost&&conn===c){
      // 相手が開始前に離脱/接続失敗 → 同じルームで再び待機
      conn=null;
      setNetWait(true,'WAITING FOR PLAYER',roomCode);
    }
  });
  c.on('error',e=>console.warn('conn error',e));
}
function bootGameFromNet(asHost,hostIsFirst){
  if(netStarted)return;
  netStarted=true;
  humanFirst=asHost?!!hostIsFirst:!hostIsFirst;
  assignSeatsFromFlags();
  document.getElementById('title').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  setNetWait(false);
  const cl=document.querySelector('#legend .who.cpu'),yl=document.querySelector('#legend .who.you');
  if(cl)cl.textContent=oppTag();
  if(yl)yl.textContent=myTag();
  resetCubies();placeStones();hl=null;anim=null;round=1;mode='MARK';hoverSt=null;
  rotatedThisTurn=false;clearTurnHist();userView=frontView();
  document.getElementById('result').classList.add('hidden');
  ['turn','modes','hint','legend'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
  showDealKnown();
}
function onNetData(msg){
  if(!msg||!msg.type)return;
  if(msg.type==='start'){
    oppName=(msg.hostName||'').slice(0,8);
    stoneSeed=(msg.seed===undefined)?null:(msg.seed>>>0);
    bootGameFromNet(false,!!msg.hostIsFirst);
    return;
  }
  if(msg.type==='ping'){
    // 参加側が名前を送ってきたらゲーム開始(ホストのみ)
    if(isHost&&!netStarted&&!startSent){oppName=(msg.name||'').slice(0,8);hostStartGame()}
    netSend({type:'pong'});return
  }
  if(msg.type==='pong')return;
  if(state==='title'||state==='over')return;
  if(msg.type==='place'){
    const st=stickerMap()[msg.i];
    if(!st||st.owner!==0)return;
    state='busy';oppHist=[];
    cpuPool=Math.max(0,cpuPool-PLACE_COST);syncCounts();
    const before=formedKeys(boardNow(),2);
    focusSticker(st);
    st.owner=2;st.mt=performance.now();SND.ui();setOppHLSticker(st);
    const formed=formedKeys(boardNow(),2).some(k=>!before.includes(k));
    if(!formed)setTimeout(()=>finishMove(2),300);
    else{focusLine(newLineOf(before,2));setUI()}
  }else if(msg.type==='mark'){
    const st=stickerMap()[msg.i];
    if(!st||st.owner!==1)return;
    state='busy';oppHist=[];
    const mb=formedKeys(boardNow(),2);
    focusSticker(st);
    st.owner=2;st.mt=performance.now();SND.mark();setOppHLMark(st);markUsed[2]++;
    focusLine(newLineOf(mb,2));
    setUI();   // 相手は同じターンで続けて回転などをするため、endを待つ
  }else if(msg.type==='rot'){
    // 相手の回転(手番はまだ終わらない)。UNDOで戻せるよう、直前の状態を記録
    state='busy';
    oppHist.push({cpuPool});
    cpuPool=Math.max(0,cpuPool-ROT_COST);syncCounts();
    focusLayer(msg.axis,msg.layer);setOppHLLayer(msg.axis,msg.layer);
    const rb=formedKeys(boardNow(),2);
    startRot(msg.axis,msg.layer,msg.dir,()=>{focusLine(newLineOf(rb,2));setUI()});
  }else if(msg.type==='unrot'){
    // 相手のUNDO: 直前の回転を逆向きに回し、記録も戻す
    const h=oppHist.pop();oppHL=null;
    focusLayer(msg.axis,msg.layer);
    startRot(msg.axis,msg.layer,msg.dir,()=>{
      if(h){
        cpuPool=h.cpuPool;syncCounts();
      }
      setUI();
    },UNDO_MS);
  }else if(msg.type==='end'){
    state='busy';oppHist=[];
    setTimeout(()=>finishMove(2),200);
  }
}
let oppHist=[];   // 相手の回転ごとの記録(相手のUNDOに対応するため)
function assignSeatsFromFlags(){
  playerPool=POOL_MAX;cpuPool=POOL_MAX;syncCounts();markLeft=0;cpuMarkLeft=0;markWindow=false;cpuMarkWindow=false;placedThisTurn=false;markStock=[0,0,0];markUsed=[0,0,0];turnStart=[null,[],[]];markedThisTurn=false;rotLockTurn=false;
}
function genRoomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';for(let i=0;i<6;i++)s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function hostStartGame(){
  const hostIsFirst=Math.random()<0.5;
  startSent=true;
  stoneSeed=(Math.random()*4294967296)>>>0;
  setNetWait(true,'STARTING…',roomCode);
  netSend({type:'start',hostIsFirst,hostName:myName(),seed:stoneSeed});
  setTimeout(()=>bootGameFromNet(true,hostIsFirst),120);
}
function makePeer(id){
  // default PeerJS cloud (omit host → uses built-in 0.peerjs.com)
  return id?new Peer(id,PEER_OPTS):new Peer(PEER_OPTS);
}
function startHost(code){
  if(typeof Peer==='undefined'){
    const s=document.getElementById('titleStatus');
    if(s)s.textContent='NETWORK LIBRARY MISSING';
    return;
  }
  netDestroy();
  playMode='pvp';isHost=true;roomCode=code;
  setNetWait(true,'CONNECTING TO SERVER…',code);
  try{peer=makePeer('ttr-'+code)}catch(e){
    setNetWait(true,'PEER CREATE FAILED','');
    return;
  }
  peer.on('open',()=>{
    setNetWait(true,'WAITING FOR PLAYER',code);
  });
  peer.on('connection',c=>{
    setNetWait(true,'PLAYER FOUND…',code);
    wireConn(c);
    const t=setTimeout(()=>{
      if(!c.open&&!netStarted){
        try{c.close()}catch(e){}
        setNetWait(true,'WAITING FOR PLAYER',code);
      }
    },25000);
    whenOpen(c,()=>{
      clearTimeout(t);
      setNetWait(true,'LINKED — WAITING NAME',code);
    });
  });
  peer.on('error',err=>{
    const t=(err&&err.type)||String(err);
    console.error('host peer error',err);
    if(t==='unavailable-id'){
      setNetWait(true,'CODE IN USE — JOIN INSTEAD',code);
    }else{
      setNetWait(true,'HOST ERROR: '+t,code);
    }
    setTimeout(()=>{setNetWait(false);netDestroy()},2500);
  });
  peer.on('disconnected',()=>{
    if(!netStarted)try{peer.reconnect()}catch(e){}
  });
}
function startJoin(code){
  if(typeof Peer==='undefined'){
    const s=document.getElementById('titleStatus');
    if(s)s.textContent='NETWORK LIBRARY MISSING';
    return;
  }
  netDestroy();
  playMode='pvp';isHost=false;roomCode=code;
  setNetWait(true,'CONNECTING TO SERVER…',code);
  try{peer=makePeer()}catch(e){
    setNetWait(true,'PEER CREATE FAILED','');
    return;
  }
  let tries=0,curFail=null;
  const tryConnect=()=>{
    if(!peer||netStarted)return;
    tries++;
    setNetWait(true,tries===1?'JOINING ROOM':'RETRY '+tries+'/12',code);
    let settled=false;
    const c=peer.connect('ttr-'+code,{reliable:true,serialization:'json'});
    const fail=why=>{
      if(settled||netStarted)return;
      settled=true;
      try{c.close()}catch(e){}
      console.warn('join fail',why);
      if(tries<12)setTimeout(tryConnect,800);
      else{
        setNetWait(true,'CANNOT JOIN — HOST FIRST?',code);
        setTimeout(()=>{setNetWait(false);netDestroy()},3000);
      }
    };
    curFail=fail;
    const timer=setTimeout(()=>fail('timeout'),20000);
    c.on('open',()=>{
      if(settled)return;settled=true;clearTimeout(timer);
      wireConn(c);
      setNetWait(true,'CONNECTED — WAITING',code);
      netSend({type:'ping',name:myName()});
    });
    c.on('error',e=>fail(e));
  };
  peer.on('open',()=>{
    setNetWait(true,'JOINING ROOM',code);
    tryConnect();
  });
  peer.on('error',err=>{
    console.error('join peer error',err);
    if(err&&err.type==='peer-unavailable'&&curFail){curFail('unavailable');return}
    setNetWait(true,'JOIN ERROR: '+((err&&err.type)||err),'');
    setTimeout(()=>{setNetWait(false);netDestroy()},2500);
  });
}
const ONLINE_ROOM='OLLOBBY';
function startOnline(){
  if(typeof Peer==='undefined'){
    const s=document.getElementById('titleStatus');
    if(s)s.textContent='NETWORK LIBRARY MISSING';
    return;
  }
  netDestroy();
  playMode='pvp';
  onlineTry(0);
}
function onlineTry(tries){
  const room=ONLINE_ROOM;
  if(tries>=10){
    setNetWait(true,'NO MATCH — TRY AGAIN','');
    setTimeout(()=>{setNetWait(false);netDestroy()},2000);
    return;
  }
  netDestroy();
  playMode='pvp';roomCode=room;
  setNetWait(true,tries?'MATCHING… '+(tries+1):'MATCHING…',room);
  let p;
  try{p=makePeer()}catch(e){setNetWait(true,'PEER CREATE FAILED','');return}
  peer=p;
  let settled=false,timer=null;
  const finish=()=>{settled=true;clearTimeout(timer)};
  const retryLater=()=>setTimeout(()=>onlineTry(tries+1),300+Math.random()*700);
  // nobody is hosting the lobby yet -> become the host
  const hostNow=()=>{
    if(settled)return;
    finish();
    try{p.destroy()}catch(e){}
    if(peer===p)peer=null;
    let h;
    try{h=makePeer('ttr-'+room)}catch(e){setNetWait(true,'PEER CREATE FAILED','');return}
    peer=h;isHost=true;
    setNetWait(true,'WAITING FOR PLAYER',room);
    h.on('connection',c=>{
      if(netStarted){try{c.close()}catch(e){}return}
      setNetWait(true,'PLAYER FOUND…',room);
      wireConn(c);
      whenOpen(c,()=>{setNetWait(true,'LINKED — WAITING NAME',room)});
    });
    h.on('error',err=>{
      // someone else grabbed the host slot at the same moment -> join them
      if(err&&err.type==='unavailable-id'){
        try{h.destroy()}catch(e){}
        if(peer===h)peer=null;
        retryLater();
        return;
      }
      setNetWait(true,'MATCH ERROR: '+((err&&err.type)||err),'');
      setTimeout(()=>{setNetWait(false);netDestroy()},2000);
    });
  };
  p.on('open',()=>{
    const c=p.connect('ttr-'+room,{reliable:true,serialization:'json'});
    timer=setTimeout(()=>{
      if(settled)return;
      try{c.close()}catch(e){}
      hostNow();
    },15000);
    c.on('open',()=>{
      if(settled)return;
      finish();
      isHost=false;
      wireConn(c);
      c.on('close',()=>{
        if(!netStarted){
          setNetWait(true,'LOBBY CLOSED','');
          setTimeout(()=>{setNetWait(false);netDestroy()},1500);
        }
      });
      setNetWait(true,'MATCH FOUND',room);
      netSend({type:'ping',name:myName()});
    });
    c.on('error',()=>{});
  });
  p.on('error',err=>{
    // 'peer-unavailable' = no host exists for this room yet (normal here)
    if(err&&err.type==='peer-unavailable'){hostNow();return}
    setNetWait(true,'MATCH ERROR: '+((err&&err.type)||err),'');
    setTimeout(()=>{setNetWait(false);netDestroy()},2000);
  });
}
function showDealKnown(){
  // 先手は両者のホストが決めた結果(humanFirst)で一致している。
  // 演出: 両者の名前が入れ替わって点滅 → 先手の名前で止まる → ゲーム開始
  state='busy';
  const deal=document.getElementById('deal');
  const name=document.getElementById('dealName');
  const sub=document.getElementById('dealSub');
  const a=myTag(),b=oppTag();
  deal.classList.remove('hidden');void deal.offsetWidth;deal.classList.add('show');
  name.classList.remove('pop');
  name.textContent='···';
  sub.textContent='';
  SND.ui();
  let n=0;
  const flick=setInterval(()=>{
    name.textContent=n%2===0?a:b;
    n++;
    if(n>8){
      clearInterval(flick);
      name.textContent=humanFirst?a:b;
      name.classList.add('pop');
      sub.textContent=humanFirst?(a+' GOES FIRST'):(b+' GOES FIRST');
      SND.ui();
      setTimeout(()=>{
        deal.classList.add('hidden');deal.classList.remove('show');
        beginPlay();
      },1100);
    }
  },90);
}

function cloneCubies(){
  return cubies.map(c=>({
    id:c.id,pos:c.pos.slice(),M:c.M.slice(),
    st:c.st.map(s=>({n:s.n.slice(),tint:s.tint,owner:s.owner,mt:s.mt}))
  }));
}
/* Snapshot before a rotate within the current turn */
function pushTurnHist(r){
  turnHist.push({
    rot:{axis:r.axis,layer:r.layer,dir:r.dir},
    cubies:cloneCubies(),
    playerPool,rotatedThisTurn,mode
  });
}
function clearTurnHist(){turnHist=[];}
function canUndo(){
  return turnHist.length>0&&state==='player'&&!anim;
}
function doUndo(){
  if(!canUndo())return;
  const s=turnHist.pop();
  state='busy';hoverSt=null;hl=null;setUI();
  // 直前の回転を逆向きに回して戻す(キューブを実際に回す演出)
  if(playMode==='pvp')netSend({type:'unrot',axis:s.rot.axis,layer:s.rot.layer,dir:-s.rot.dir});
  startRot(s.rot.axis,s.rot.layer,-s.rot.dir,()=>{
    cubies=s.cubies;
    playerPool=s.playerPool;syncCounts();
    rotatedThisTurn=s.rotatedThisTurn;
    mode=s.mode;
    state='player';
    setUI();
    SND.ui();
  },UNDO_MS);
}
const UNDO_MS=300;

/* ---------- sound ---------- */
let AC=null,soundOn=true;
function tone(f1,f2,dur,type,vol,delay){
  if(!AC||!soundOn)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.03);
}
const SND={
  ui:()=>tone(900,700,.05,'square',.035),
  mark:()=>tone(1300,520,.07,'square',.07),
  rot:()=>{tone(150,70,.3,'sawtooth',.05);[0,.08,.16,.24].forEach(d=>tone(320,180,.03,'square',.035,d))},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f*1.01,.13,'triangle',.09,i*.09)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,f*.98,.16,'triangle',.09,i*.12))
};

/* ---------- 3D helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeBack=t=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
let VM=null;
function proj(P){
  const v=mulV(VM,P),k=F_OF()/(D-v[2]);
  return [CX+v[0]*k,CY-v[1]*k,k,v];
}
function quad(fc,u,v,h,off){
  const c=off?[fc[0]+off[0],fc[1]+off[1],fc[2]+off[2]]:fc;
  return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>
    proj([c[0]+h*(a*u[0]+b*v[0]),c[1]+h*(a*u[1]+b*v[1]),c[2]+h*(a*u[2]+b*v[2])]));
}
function poly(pts,fill,stroke,lw){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.lineJoin='round';ctx.stroke()}
}
function glyph(kind,fc,u,v,nw,prog,col){
  const lift=[fc[0]+nw[0]*.004,fc[1]+nw[1]*.004,fc[2]+nw[2]*.004];
  const k=proj(lift)[2];
  ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineWidth=Math.max(2,k*.085*Math.min(1,prog+.2));
  ctx.beginPath();
  if(kind===1){
    const r=.29*prog;
    for(let i=0;i<=36;i++){
      const t=i/36*Math.PI*2,c=Math.cos(t)*r,s=Math.sin(t)*r;
      const p=proj([lift[0]+c*u[0]+s*v[0],lift[1]+c*u[1]+s*v[1],lift[2]+c*u[2]+s*v[2]]);
      i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);
    }
  }else{
    const r=.27*prog;
    for(const sg of [1,-1]){
      const a=proj([lift[0]+r*(u[0]+sg*v[0]),lift[1]+r*(u[1]+sg*v[1]),lift[2]+r*(u[2]+sg*v[2])]);
      const b=proj([lift[0]-r*(u[0]+sg*v[0]),lift[1]-r*(u[1]+sg*v[1]),lift[2]-r*(u[2]+sg*v[2])]);
      ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
    }
  }
  ctx.stroke();
}

/* ---------- drawing ---------- */
function draw(now){
  ctx.clearRect(0,0,W,H);
  VM=userView;
  const faces=[],cam=[0,0,D];
  for(const c of cubies){
    let R=null;
    if(anim&&c.pos[anim.axis]===anim.layer)R=rotM(anim.axis,anim.ang);
    const cen=R?mulV(R,c.pos):c.pos,Mw=R?mulM(R,c.M):c.M;
    for(let ax=0;ax<3;ax++)for(const sg of [-1,1]){
      const nl=[0,0,0];nl[ax]=sg;
      const nw=mulV(Mw,nl);
      const fc=[cen[0]+nw[0]*.5,cen[1]+nw[1]*.5,cen[2]+nw[2]*.5];
      const fv=mulV(VM,fc),nv=mulV(VM,nw);
      if(nv[0]*(cam[0]-fv[0])+nv[1]*(cam[1]-fv[1])+nv[2]*(cam[2]-fv[2])<=0)continue;
      faces.push({c,nw,fc,u:mulV(Mw,AX[(ax+1)%3]),v:mulV(Mw,AX[(ax+2)%3]),
        dist:fv[0]*fv[0]+fv[1]*fv[1]+(D-fv[2])*(D-fv[2]),
        st:c.st.find(s=>s.n[ax]===sg)});
    }
  }
  faces.sort((a,b)=>b.dist-a.dist);
  hits=[];
  const pulse=.5+.5*Math.sin(now/170);
  const formed=formedStickers();
  for(const f of faces){
    poly(quad(f.fc,f.u,f.v,.5),BODY,BODY,1.2);
    const st=f.st;
    if(!st)continue;
    const off=[f.nw[0]*.003,f.nw[1]*.003,f.nw[2]*.003];
    const sp=quad(f.fc,f.u,f.v,.43,off);
    const win=hl&&hl.has(st);
    const ow=st.owner;
    let fill=st.tint,mc='#000';
    if(ow===1){fill='#fff';mc='#000'}
    else if(ow===2){fill='#050505';mc='#fff'}
    if(win){fill=pulse>.5?ACC:'#c42a25';mc='#fff'}
    else if(formed&&formed.has(st)){fill='#c42a25';mc='#fff'}
    poly(sp,fill,ow===2&&!win?'#4a4a4a':null,1.5);
    if(oppHL&&oppHL.has(st)){ctx.globalAlpha=.35+.25*Math.sin(now/160);poly(sp,oppHLColor,null,0);ctx.globalAlpha=1}
    if(ow>0){
      const prog=st.mt<0?1:easeBack(clamp((now-st.mt)/300,0,1));
      glyph(ow,f.fc,f.u,f.v,f.nw,Math.max(.01,prog),mc);
    }else if(hoverSt===st&&mode==='MARK'&&markLeft>0&&state==='player'&&!anim){
      ctx.globalAlpha=.4;glyph(1,f.fc,f.u,f.v,f.nw,1,'#000');ctx.globalAlpha=1;
    }else if(hoverSt===st&&mode==='PLACE'&&placeOK()&&!anim){
      ctx.globalAlpha=.4;glyph(1,f.fc,f.u,f.v,f.nw,1,'#000');ctx.globalAlpha=1;
    }
    hits.push({poly:sp,c:f.c,st,nw:rnd(f.nw)});
  }
}
function inPoly(p,x,y){
  let ins=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++){
    const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];
    if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins;
  }
  return ins;
}
function hitTest(x,y){
  for(let i=hits.length-1;i>=0;i--)if(inPoly(hits[i].poly,x,y))return hits[i];
  return null;
}

/* ---------- rotation animation ---------- */
function startRot(axis,layer,dir,done,dur=430){
  anim={axis,layer,dir,t0:performance.now(),dur,ang:0,done};
  SND.rot();
}
function updateAnim(now){
  if(!anim)return;
  const t=clamp((now-anim.t0)/anim.dur,0,1);
  anim.ang=anim.dir*(Math.PI/2)*ease(t);
  if(t>=1){
    const R=rotM(anim.axis,anim.dir*Math.PI/2),a=anim;
    for(const c of cubies)if(c.pos[a.axis]===a.layer){c.pos=rnd(mulV(R,c.pos));c.M=rnd(mulM(R,c.M))}
    anim=null;
    a.done&&a.done();
  }
}

/* ---------- turn flow ---------- */
const $=id=>document.getElementById(id);
let lastWho=2;
/* 回転は残コストがあれば自由に使える(相手リーチの阻止に限定しない) */
function blocksOpp(r,who){
  return (who===1?playerPool:cpuPool)>=ROT_COST;
}
function rotOK(who){return ROTS.some(r=>blocksOpp(r,who))}
function playerMarkOK(){return markLeft>0}
function playerRotOK(){return !rotLockTurn&&rotOK(1)}
function placeOK(){return state==='player'&&!anim&&!rotatedThisTurn&&!placedThisTurn&&playerPool>=PLACE_COST&&boardNow().some(x=>x===0)}
function playerHasAction(){return playerMarkOK()||playerRotOK()||placeOK()}
function setUI(){
  syncMarks();
  const mine=state==='player';
  const opp=oppTag();
  const oppTurn=opp+' TURN';
  $('turn').textContent=state==='over'?'':(mine||(state==='busy'&&lastWho===2)?'YOUR TURN':oppTurn);
  if(state==='busy'&&lastWho===1)$('turn').textContent=oppTurn;
  if(state==='busy'&&lastWho===2)$('turn').textContent='YOUR TURN';
  const cpuWho=document.querySelector('#legend .who.cpu');
  if(cpuWho)cpuWho.textContent=opp;
  const youWho=document.querySelector('#legend .who.you');
  if(youWho)youWho.textContent=myTag();
  const can=state==='player';
  const canMark=can&&markLeft>0;
  const canRot=can&&playerRotOK();
  const canPlace=can&&placeOK();
  // auto-switch mode when current choice is exhausted
  if(can&&mode==='MARK'&&!canMark&&canRot)mode='ROTATE';
  if(can&&mode==='ROTATE'&&!canRot&&canMark)mode='MARK';
  if(can&&mode==='PLACE'&&!canPlace)mode=canMark?'MARK':(canRot?'ROTATE':'MARK');
  if(can&&mode!=='PLACE'&&!canMark&&!canRot&&canPlace)mode='PLACE';
  $('mPlace').disabled=!canPlace;
  $('mPlace').classList.toggle('on',mode==='PLACE'&&canPlace);
  $('mMark').disabled=!canMark;
  $('mRot').disabled=!canRot;
  $('mMark').classList.toggle('on',mode==='MARK'&&canMark);
  $('mRot').classList.toggle('on',mode==='ROTATE'&&canRot);
  // END TURN: after rotate, or when no marks left (must rotate/end)
  const endBtn=$('mEnd');
  if(endBtn){
    const showEnd=can&&(rotatedThisTurn||placedThisTurn||markedThisTurn||!playerHasAction());
    endBtn.classList.toggle('hidden',!showEnd);
    endBtn.disabled=!showEnd;
  }
  if(!can){
    $('hint').textContent='';
  }else if(!playerHasAction()){
    $('hint').textContent='No moves left. End turn.';
  }else if(mode==='PLACE'&&canPlace){
    $('hint').textContent='Tap an empty square to place a stone (costs '+PLACE_COST+' rotation budget).';
  }else if(mode==='MARK'&&canMark){
    $('hint').textContent='Convert a CPU mark (uses one stored mark).';
  }else if(mode==='ROTATE'&&canRot){
    $('hint').textContent=rotatedThisTurn?'Rotate more, or end turn.':'Drag a face to rotate.';
  }else if(markLeft<=0){
    $('hint').textContent='No marks left. Rotate only.';
  }else{
    $('hint').textContent='No rotates left. Place a mark.';
  }
  const setStat=(id,label,n,lowAt)=>{
    const el=$(id);if(!el)return;
    el.textContent=label+' '+n;
    el.classList.toggle('low',n<=lowAt);
  };
  const rt=$('roundTop');if(rt)rt.textContent='ROUND '+round;
  // 選択パネルのMARK横: 今使えるMARKの回数(単位つき)
  const mcost=$('mMark')&&$('mMark').querySelector('.cost');
  if(mcost)mcost.textContent=markLeft+(markLeft===1?' use':' uses');
  // 駒の数: YOU / CPUそれぞれ、盤面上の自分の駒数
  const pieces=boardNow().reduce((a,x)=>{if(x===1)a[0]++;else if(x===2)a[1]++;return a},[0,0]);
  setStat('pMarks','PIECE',pieces[0],2);
  setStat('cMarks','PIECE',pieces[1],2);
  setStat('pRots','ROTATE',rotLeft,5);
  setStat('cRots','ROTATE',cpuRotLeft,5);
  const undoBtn=$('undo');
  if(undoBtn)undoBtn.disabled=!canUndo();
  cv.style.cursor=can?(mode==='MARK'&&canMark?'default':(mode==='ROTATE'&&canRot?'grab':'default')):'default';
}
/* 盤面で完成したラインの履歴をエンジン用の形式に変換 */
function lineStateForCpu(){
  const ls=[new Uint8Array(LINES.length),new Uint8Array(LINES.length)];
  LINES.forEach((l,k)=>{const b=boardNow();if(l.every(i=>b[i]===1))ls[0][k]=1;if(l.every(i=>b[i]===2))ls[1][k]=1});
  return ls;
}
/* 勝敗: 駒が2個以下になった側は即負け。どちらかの回転予算が尽きたら終了し、駒の多い方が勝ち */
function gameResult(){
  const b=boardNow(),[s1,s2]=stoneCountsOf(b);
  const lose1=s1<=2,lose2=s2<=2;
  if(lose1||lose2){
    if(lose1&&lose2)return s1>s2?'P':s2>s1?'C':'D';
    return lose1?'C':'P';
  }
  if(playerPool>0||cpuPool>0)return null;   // 両者の回転予算が尽きるまで続ける
  return s1>s2?'P':s2>s1?'C':'D';
}
function finishMove(who){
  lastWho=who;
  rotLockTurn=false;markedThisTurn=false;
  if(who===1)oppHL=null;   // 自分の手番が終わったら、相手の手の表示を消す
  markWindow=false;cpuMarkWindow=false;placedThisTurn=false;
  clearTurnHist();
  const b=boardNow(),o=gameResult();
  if(o){endGame(o,b);return}
  // このターンに作ったライン(ターン開始時になく、今ある)の数だけ、次以降に使えるMARK権を累積
  const made=formedKeys(b,who).filter(k=>!(turnStart[who]||[]).includes(k));
  markStock[who]+=made.length;
  turnStart[3-who]=formedKeys(b,3-who);   // 相手の手番が始まる時点のライン
  syncMarks();
  if(who===1){
    if(!humanFirst)round++;
    state='cpu';rotatedThisTurn=false;setUI();
    if(playMode==='cpu')setTimeout(cpuTurn,650);
    // pvp: wait for opponent messages
  }else{
    if(humanFirst)round++;
    state='player';rotatedThisTurn=false;
    mode=markLeft>0?'MARK':(rotLeft>0?'ROTATE':'MARK');
    setUI();
    if(!playerHasAction())setTimeout(()=>endPlayerTurn(true),300);
  }
}
function cpuTurn(){
  if(state!=='cpu'||playMode!=='cpu')return;
  state='busy';lastWho=1;setUI();
  cpuStep(0,false);
}
function cpuStep(n,win,marked){
  const o0=gameResult();
  if(o0){endGame(o0,boardNow());return}
  const P=LEVELS[level]||LEVELS.EASY;
  const b=boardNow();
  cpuMarkWindow=!!win;
  const a=chooseIter(b,2,[0,playerPool,cpuPool],n,P,Math.random,lineStateForCpu(),!!win,markStock[2]>0&&!marked);
  if(a.type==='end'){cpuMarkWindow=false;setTimeout(()=>finishMove(2),200);return}
  if(a.type==='place'){
    const before=formedKeys(boardNow(),2);
    cpuPool=Math.max(0,cpuPool-PLACE_COST);syncCounts();
    const st=stickerMap()[a.i];focusSticker(st);st.owner=2;st.mt=performance.now();SND.ui();setOppHLSticker(st);
    const formed=formedKeys(boardNow(),2).some(k=>!before.includes(k));
    focusLine(newLineOf(before,2));
    setUI();
    setTimeout(()=>finishMove(2),420);
  }else if(a.type==='mark'){
    markStock[2]--;markUsed[2]++;
    cpuMarkWindow=false;
    const mb=formedKeys(boardNow(),2);
    const st=stickerMap()[a.i];focusSticker(st);st.owner=2;st.mt=performance.now();SND.mark();setOppHLMark(st);
    focusLine(newLineOf(mb,2));
    setUI();
    setTimeout(()=>cpuStep(n+1,false,true),420);   // MARKの後も同じターンで続けられる
  }else{
    cpuPool=Math.max(0,cpuPool-ROT_COST);syncCounts();
    const r=ROTS[a.r];focusLayer(r.axis,r.layer);setOppHLLayer(r.axis,r.layer);
    const before=formedKeys(boardNow(),2);
    startRot(r.axis,r.layer,r.dir,()=>setTimeout(()=>{
      const formed=formedKeys(boardNow(),2).some(k=>!before.includes(k));
      if(formed)focusLine(newLineOf(before,2));
      cpuStep(n+1,formed,marked);   // 揃ったら回転はできない(MARKか終了のみ)。揃わなければ続けて考える
    },120));
  }
}
/* ステッカーが盤面のどのマス(0..53)か */
function slotOfSticker(st){const map=stickerMap();for(let i=0;i<NCELL;i++)if(map[i]===st)return i;return -1}
/* 配置: 空きマスに自分の駒を置く。揃えば同じターンでMARKか終了を選べる。揃わなければターン終了 */
function doPlayerPlace(st){
  if(!placeOK()||st.owner!==0)return;
  clearTurnHist();
  state='busy';lastWho=2;placedThisTurn=true;
  playerPool-=PLACE_COST;syncCounts();
  const before=formedKeys(boardNow(),1);
  const i=slotOfSticker(st);
  st.owner=1;st.mt=performance.now();SND.ui();
  if(playMode==='pvp')netSend({type:'place',i});
  focusLine(findNewLine(before));
  setUI();
  setTimeout(()=>{if(playMode==='pvp')netSend({type:'end'});finishMove(1)},300);
}
function doPlayerMark(st){
  if(markLeft<=0||st.owner!==2)return;
  markStock[1]--;markUsed[1]++;   // 累積したMARK権を1つ使う
  markWindow=false;
  clearTurnHist();
  state='busy';lastWho=2;
  const before=formedKeys(boardNow(),1);
  // find slot index for net sync
  let slot=-1;const map=stickerMap();
  for(let i=0;i<NCELL;i++)if(map[i]===st){slot=i;break}
  st.owner=1;st.mt=performance.now();SND.mark();setUI();focusLine(findNewLine(before));
  if(playMode==='pvp')netSend({type:'mark',i:slot});
  markedThisTurn=true;   // 1ターン1回。ただし、この後も回転やターン終了はできる
  setTimeout(()=>{
    if(state!=='busy')return;
    state='player';setUI();
    if(!playerHasAction())endPlayerTurn(true);
  },400);
}
function doPlayerRot(r){
  if(!blocksOpp(r,1)||rotLockTurn)return;   // 回転予算がない、またはこのターンはもう回転できない
  pushTurnHist(r);
  state='busy';lastWho=2;setUI();
  playerPool-=ROT_COST;syncCounts();
  rotatedThisTurn=true;
  markWindow=false;            // 回転すると、揃った直後のMARK権は閉じる
  if(playMode==='pvp')netSend({type:'rot',axis:r.axis,layer:r.layer,dir:r.dir});
  const before=formedKeys(boardNow(),1);
  startRot(r.axis,r.layer,r.dir,()=>{
    const b=boardNow(),o=gameResult();
    if(o){endGame(o,b);return}
    const nl=findNewLine(before);
    rotLockTurn=!!nl;          // 回転でラインが揃ったら、このターンの回転は終わり
    markWindow=false;          // 揃った直後のMARKは廃止(累積分のみ)
    focusLine(nl);
    state='player';
    setUI();
  });
}
function endPlayerTurn(force){
  if(state!=='player')return;
  if(!force&&!rotatedThisTurn&&!placedThisTurn&&!markedThisTurn&&playerHasAction())return;
  clearTurnHist();
  state='busy';lastWho=2;setUI();
  if(playMode==='pvp')netSend({type:'end'});
  setTimeout(()=>finishMove(1),200);
}
function endGame(o,b){
  state='over';
  hl=new Set();
  const want=o==='P'?[1]:o==='C'?[2]:[1,2],map=stickerMap();
  for(const l of LINES){
    const a=b[l[0]];
    if(a&&a===b[l[1]]&&a===b[l[2]]&&want.includes(a))l.forEach(i=>hl.add(map[i]));
  }
  setUI();
  $('turn').classList.add('hidden');$('modes').classList.add('hidden');$('hint').classList.add('hidden');$('legend').classList.add('hidden');
  if($('mEnd'))$('mEnd').classList.add('hidden');
  setTimeout(()=>{
    $('rtext').textContent=o==='P'?'YOU WIN':o==='C'?'YOU LOSE':'DRAW';
    $('rtext').classList.remove('small');
    $('rbtns').classList.remove('show');
    $('result').classList.remove('hidden');
    if(o==='P')SND.win();else if(o==='C')SND.lose();else SND.ui();
    setTimeout(()=>{$('rtext').classList.add('small');$('rbtns').classList.add('show')},1500);
  },o==='D'?400:700);
}

function assignSeats(){
  humanFirst=Math.random()<0.5;
  playerPool=POOL_MAX;cpuPool=POOL_MAX;syncCounts();markLeft=0;cpuMarkLeft=0;markWindow=false;cpuMarkWindow=false;placedThisTurn=false;markStock=[0,0,0];markUsed=[0,0,0];turnStart=[null,[],[]];markedThisTurn=false;rotLockTurn=false;
}
function beginPlay(){
  $('deal').classList.add('hidden');$('deal').classList.remove('show');

  if(humanFirst){
    state='player';lastWho=2;mode=markLeft>0?'MARK':'ROTATE';
    layoutCube();setUI();
  }else{
    state='cpu';lastWho=1;mode='MARK';
    layoutCube();setUI();
    if(playMode==='cpu')setTimeout(cpuTurn,700);
  }
}
function showDealThenStart(){
  state='busy';
  assignSeats();
  const oppLabel=oppTag();
  const deal=$('deal'),name=$('dealName'),sub=$('dealSub');
  deal.classList.remove('hidden');
  void deal.offsetWidth;
  deal.classList.add('show');
  name.classList.remove('pop');
  name.textContent='···';
  sub.textContent='';
  SND.ui();
  let n=0;
  const flick=setInterval(()=>{
    name.textContent=n%2===0?'YOU':oppLabel;
    n++;
    if(n>8){
      clearInterval(flick);
      name.textContent=humanFirst?'YOU':oppLabel;
      name.classList.add('pop');
      sub.textContent=humanFirst?'YOU GO FIRST':(oppLabel+' GOES FIRST');
      SND.ui();
      setTimeout(beginPlay,1100);
    }
  },90);
}
function newGame(){
  resetCubies();placeStones();hl=null;anim=null;round=1;mode='MARK';hoverSt=null;
  rotatedThisTurn=false;clearTurnHist();
  userView=frontView();
  const L=LEVELS[level]||LEVELS.EASY;
  mistakesLeft=L.mistakesPerGame;
  $('result').classList.add('hidden');
  $('turn').classList.remove('hidden');$('modes').classList.remove('hidden');$('hint').classList.remove('hidden');$('legend').classList.remove('hidden');
  if($('mEnd'))$('mEnd').classList.add('hidden');
  layoutCube();
  showDealThenStart();
}
function toTitle(){
  netDestroy();
  playMode='cpu';
  resetCubies();placeStones();hl=null;anim=null;state='title';
  $('result').classList.add('hidden');
  $('deal').classList.add('hidden');$('deal').classList.remove('show');
  setNetWait(false);
  $('game').classList.add('hidden');$('title').classList.remove('hidden');
  $('localBox').classList.add('hidden');
  $('nickInput').classList.add('hidden');
  $('btnOnlineStart').classList.add('hidden');
  $('titleStatus').textContent='';
  layoutCube();
}

/* ---------- rotate-by-drag: which slice, which way ---------- */
function solveRot(h,d){
  const n=h.nw,nIdx=n.findIndex(v=>v!==0),pos=h.c.pos;
  const fc=[pos[0]+n[0]*.5,pos[1]+n[1]*.5,pos[2]+n[2]*.5],a=proj(fc);
  let best=null,bs=0;
  for(let t=0;t<3;t++){
    if(t===nIdx)continue;
    const b=proj([fc[0]+AX[t][0],fc[1]+AX[t][1],fc[2]+AX[t][2]]);
    const sd=[b[0]-a[0],b[1]-a[1]],len=Math.hypot(sd[0],sd[1]);
    if(len<1e-6)continue;
    const dot=(d[0]*sd[0]+d[1]*sd[1]),sc=Math.abs(dot)/len;
    if(sc>bs){bs=sc;best={t,sign:dot>=0?1:-1}}
  }
  if(!best)return null;
  const tvec=AX[best.t].map(v=>v*best.sign);
  const u=3-nIdx-best.t,uvec=AX[u];
  const cr=[uvec[1]*n[2]-uvec[2]*n[1],uvec[2]*n[0]-uvec[0]*n[2],uvec[0]*n[1]-uvec[1]*n[0]];
  const s=cr[0]*tvec[0]+cr[1]*tvec[1]+cr[2]*tvec[2]>0?1:-1;
  return {axis:u,layer:pos[u],dir:s};
}

/* ---------- pointer input ---------- */
let down=null;
const canAct=()=>state==='player'&&!anim;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  if(state==='title'){down={mode:'orbit',lx:e.clientX,ly:e.clientY};return}
  down={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,hit:hitTest(e.clientX,e.clientY),mode:null};
});
cv.addEventListener('pointermove',e=>{
  if(!down){
    const h=hitTest(e.clientX,e.clientY);
    hoverSt=(h&&((h.st.owner===2&&markLeft>0)||(h.st.owner===0&&mode==='PLACE'&&placeOK())))?h.st:null;
    cv.style.cursor=!canAct()?'default':(h?(((mode==='MARK'&&markLeft>0)||(mode==='PLACE'&&placeOK()))?(hoverSt?'pointer':'default'):(mode==='ROTATE'&&rotLeft>0?'grab':'default')):'default');
    return;
  }
  if(!down.mode){
    const dx=e.clientX-down.x,dy=e.clientY-down.y;
    if(Math.hypot(dx,dy)<=10)return;
    if(mode==='ROTATE'&&canAct()&&down.hit){
      const r=solveRot(down.hit,[dx,dy]);
      if(r){down.mode='rot';hoverSt=null;doPlayerRot(r);return}
    }
    down.mode='orbit';down.lx=e.clientX;down.ly=e.clientY;hoverSt=null;return;
  }
  if(down.mode==='orbit'){
    orbit(e.clientX-down.lx,e.clientY-down.ly);
    down.lx=e.clientX;down.ly=e.clientY;
  }
});
cv.addEventListener('pointerup',e=>{
  if(down&&!down.mode&&mode==='PLACE'&&canAct()){
    const h=hitTest(e.clientX,e.clientY);
    if(h&&h.st.owner===0)doPlayerPlace(h.st);
    down=null;return;
  }
  if(down&&!down.mode&&mode==='MARK'&&markLeft>0&&canAct()){
    const h=hitTest(e.clientX,e.clientY);
    if(h&&h.st.owner===2)doPlayerMark(h.st);
  }
  down=null;
});
cv.addEventListener('pointercancel',()=>{down=null});
cv.addEventListener('pointerleave',()=>{if(!down)hoverSt=null});

/* ---------- buttons ---------- */
function ensureAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function startCpu(lv){

  playMode='cpu';level=lv;netDestroy();
  $('title').classList.add('hidden');$('game').classList.remove('hidden');
  newGame();
}

$('btnOnline').onclick=()=>{
  ensureAudio();SND.ui();
  $('localBox').classList.add('hidden');
  $('nickInput').classList.remove('hidden');

};
$('btnOnlineStart').onclick=()=>{ensureAudio();SND.ui();startOnline()};
$('netCancel').onclick=()=>{netDestroy();setNetWait(false);$('titleStatus').textContent=''};
$('mPlace').onclick=()=>{if(!placeOK())return;mode='PLACE';SND.ui();setUI()};
$('mMark').onclick=()=>{if(state!=='player'||markLeft<=0)return;mode='MARK';SND.ui();setUI()};
$('mRot').onclick=()=>{if(state!=='player'||rotLeft<=0)return;mode='ROTATE';SND.ui();setUI()};
$('mEnd').onclick=()=>{if(state!=='player')return;SND.ui();endPlayerTurn()};
$('undo').onclick=()=>doUndo();
$('back').onclick=()=>{SND.ui();toTitle()};
$('back2').onclick=()=>{SND.ui();toTitle()};
$('restart').onclick=()=>{
  SND.ui();
  if(playMode==='pvp')toTitle();
  else newGame();
};
$('snd').onclick=()=>{soundOn=!soundOn;$('snd').textContent=soundOn?'SOUND ON':'SOUND OFF';SND.ui()};
addEventListener('keydown',e=>{
  if(state!=='player')return;
  if((e.key==='p'||e.key==='P')&&placeOK()){mode='PLACE';SND.ui();setUI()}
  if((e.key==='m'||e.key==='M')&&markLeft>0){mode='MARK';SND.ui();setUI()}
  if((e.key==='r'||e.key==='R')&&rotLeft>0){mode='ROTATE';SND.ui();setUI()}
});

/* ---------- main loop ---------- */
let prev=performance.now();
function loop(now){
  const dt=Math.min(50,now-prev);prev=now;
  if(state==='title'&&!(down&&down.mode))userView=orth(mulM(rotM(1,dt*.0004),userView));
  followCam(dt);
  updateAnim(now);
  draw(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
