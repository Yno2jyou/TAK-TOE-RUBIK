<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TAC TOE RUBIK</title>
<style>
:root{--bg:#f5f5f3;--fg:#111;--mute:#8d8d89;--acc:#e5322d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);

canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
.btn{font:inherit;letter-spacing:.14em;font-weight:700;font-size:15px;text-transform:uppercase;
  background:transparent;color:var(--fg);border:2px solid var(--fg);padding:10px 24px;min-width:118px;cursor:pointer;
  transition:background .12s,color .12s,opacity .12s}
.btn:hover:not(:disabled){background:#e4e4e0}
.btn.on{background:var(--fg);color:#fff}
.btn:disabled{opacity:.28;cursor:default}
.btn.sm{font-size:12px;padding:6px 12px;min-width:0;border-width:1.5px}
.btn.big{font-size:20px;padding:14px 48px}
#title{
  position:fixed;inset:0;pointer-events:none;z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:max(10px,1.5vh) 12px max(12px,1.5vh);
}
#title h1{
  font-weight:800;font-size:min(8vw,48px);letter-spacing:.2em;padding-left:.2em;text-align:center;
  flex-shrink:0;margin-top:0;line-height:1.15;
}
#title h1 .br{display:block}
@media (max-width:640px){
  #title h1{font-size:min(11vw,42px);letter-spacing:.16em}
}
#title .mid{flex:1;min-height:0;width:100%;pointer-events:none}
#title .panel{
  pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:10px;
  width:min(420px,94vw);flex-shrink:0;padding:4px 2px;
}
#title .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#title .sec{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--mute);margin-top:2px}
#title input[type=text]{

#title .status{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--mute);min-height:18px;text-align:center}

  position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;

#bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;z-index:3;font-size:13px;font-weight:700}
#bar .r{display:flex;gap:12px;align-items:center}
/* Play UI under the cube */
#hud{
  position:fixed;left:0;right:0;bottom:max(28px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:14px;
  z-index:2;pointer-events:none;padding:0 16px;
}
#turn{
  font-size:15px;font-weight:700;letter-spacing:.18em;
  display:flex;align-items:center;gap:8px;color:var(--fg);
}
#turn::before{
  content:'';width:8px;height:8px;border-radius:50%;background:var(--fg);flex-shrink:0;
}
#modes{
  display:flex;align-items:center;pointer-events:auto;
  background:#fff;border:1.5px solid #e0e0dc;border-radius:999px;
  padding:3px;box-shadow:0 1px 2px rgba(0,0,0,.04);
}
#modes button{
  font:inherit;letter-spacing:.14em;font-weight:700;font-size:13px;text-transform:uppercase;
  border:none;background:transparent;color:#b0b0ac;padding:10px 28px;border-radius:999px;
  cursor:pointer;transition:background .15s,color .15s,opacity .15s;min-width:0;
}
#modes button.on{background:var(--fg);color:#fff}
#modes button:disabled{opacity:.4;cursor:default}
#modes button:not(.on):not(:disabled):hover{color:var(--fg)}
.end-btn{
  pointer-events:auto;font:inherit;letter-spacing:.14em;font-weight:700;font-size:12px;text-transform:uppercase;
  background:var(--fg);color:#fff;border:none;border-radius:999px;padding:10px 22px;cursor:pointer;
  transition:opacity .15s,background .15s;
}
.end-btn:hover{background:#333}
.end-btn:disabled{opacity:.4;cursor:default}
#hint{font-size:13px;color:var(--mute);height:18px;letter-spacing:.04em}
#legend{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--mute);margin-top:4px;
}
#legend .row{
  display:flex;align-items:center;justify-content:center;gap:14px;min-width:260px;
}
#legend .who{
  display:flex;align-items:center;gap:6px;color:var(--fg);min-width:52px;
}
#legend .who.you::before{

}
#legend .who.cpu::before{
  content:'';width:7px;height:7px;border-radius:50%;background:var(--acc);
}
#legend .stat{color:var(--mute);letter-spacing:.1em;min-width:72px;text-align:center}
#legend .stat.low{color:var(--acc)}
#deal{
  position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(245,245,243,.92);pointer-events:none;opacity:0;transition:opacity .35s;

#deal.show{opacity:1}
#deal .label{font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--mute);margin-bottom:18px}
#deal .name{
  font-weight:800;font-size:min(12vw,64px);letter-spacing:.18em;padding-left:.18em;
  transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s;
}
#deal .sub{margin-top:14px;font-size:14px;font-weight:700;letter-spacing:.16em;color:var(--mute)}
#deal .name.pop{transform:scale(1.08)}
#result{position:fixed;inset:0;z-index:4;pointer-events:none}
#rtext{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-weight:800;
  font-size:min(15vw,112px);letter-spacing:.14em;padding-left:.14em;transition:all .6s cubic-bezier(.3,.7,.2,1);
  text-shadow:0 0 28px var(--bg),0 0 14px var(--bg),0 0 6px var(--bg)}
#rtext.small{top:21%;font-size:min(9vw,52px)}
#rbtns{position:absolute;left:0;right:0;bottom:15%;display:flex;gap:12px;justify-content:center;pointer-events:auto;opacity:0;transition:opacity .4s .5s}
#rbtns.show{opacity:1}
@media (max-width:520px){
  .btn{min-width:104px;padding:10px 16px;font-size:14px}
  #modes button{padding:9px 22px;font-size:12px}
}

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<script>
'use strict';
/* =====================================================
   PART 1 : GAME LOGIC  (no drawing here)
   A cell = ONE square (sticker) on the outside of the cube. 54 cells.
   slot = face*9 + row*3 + col   (face = axis*2 + (plus?0:1))
   owner: 0 empty / 1 YOU (O) / 2 CPU (X)
   Lines = 3 squares in a straight row on one face (rows, columns, diagonals).
   Turning a slice moves the squares (and their marks) to new slots.
   ===================================================== */
const AX=[[1,0,0],[0,1,0],[0,0,1]];
const IDX=(x,y,z)=>(x+1)+3*(y+1)+9*(z+1);
const POS=[];
for(let z=-1;z<=1;z++)for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++)POS[IDX(x,y,z)]=[x,y,z];
const NCELL=54;

/* matrices (row-major 3x3) */
function rotM(axis,th){
  const c=Math.cos(th),s=Math.sin(th),t=1-c,[x,y,z]=AX[axis];
  return [t*x*x+c,t*x*y-s*z,t*x*z+s*y, t*x*y+s*z,t*y*y+c,t*y*z-s*x, t*x*z-s*y,t*y*z+s*x,t*z*z+c];
}
const mulV=(M,v)=>[M[0]*v[0]+M[1]*v[1]+M[2]*v[2],M[3]*v[0]+M[4]*v[1]+M[5]*v[2],M[6]*v[0]+M[7]*v[1]+M[8]*v[2]];
function mulM(A,B){const r=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++)r.push(A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j]);return r}
const rnd=a=>a.map(v=>{const r=Math.round(v);return r===0?0:r});

/* slot of a square sitting on cubie position p, facing direction n */
function slotOf(p,n){
  const ni=n.findIndex(v=>v!==0),f=ni*2+(n[ni]>0?0:1),a=(ni+1)%3,b=(ni+2)%3;
  return f*9+(p[a]+1)*3+(p[b]+1);
}
const SLOT=[];
for(const p of POS)for(let ax=0;ax<3;ax++)if(p[ax]!==0){
  const n=[0,0,0];n[ax]=p[ax];SLOT[slotOf(p,n)]={p,n};
}

/* winning lines: 8 per face (3 rows, 3 columns, 2 diagonals) x 6 faces = 48 */
const LINES=(()=>{
  const g=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],out=[];
  for(let f=0;f<6;f++)for(const l of g)out.push(l.map(i=>f*9+i));
  return out;
})();
const LINE_COUNT=new Array(NCELL).fill(0);
LINES.forEach(l=>l.forEach(i=>LINE_COUNT[i]++));

/* all 18 turns: 3 axes x 3 slices x 2 directions (dir*90deg, right-hand rule) */
const ROTS=[];
for(let axis=0;axis<3;axis++)for(let layer=-1;layer<=1;layer++)for(const dir of [1,-1]){
  const R=rotM(axis,dir*Math.PI/2),perm=[];
  for(let s=0;s<NCELL;s++){
    const {p,n}=SLOT[s];
    perm[s]=p[axis]===layer?slotOf(rnd(mulV(R,p)),rnd(mulV(R,n))):s;
  }
  ROTS.push({axis,layer,dir,perm});
}
function rotBoard(b,r){const nb=b.slice();for(let i=0;i<NCELL;i++)nb[r.perm[i]]=b[i];return nb}

function lineOwners(b){
  let p=false,c=false;
  for(const l of LINES){
    const a=b[l[0]];
    if(a&&a===b[l[1]]&&a===b[l[2]]){if(a===1)p=true;else c=true}
  }
  return {p,c};
}
/* result after a move: 'P' you win / 'C' cpu wins / 'D' draw / null continue.
   (a turn that makes lines for both sides = draw) */
function outcome(b){
  const {p,c}=lineOwners(b);
  if(p&&c)return 'D';
  if(p)return 'P';
  if(c)return 'C';
  for(let i=0;i<NCELL;i++)if(b[i]===0)return null;
  return 'D';
}
function genMoves(b,allowMark=true,allowRot=true){
  const ms=[];
  if(allowMark)for(let i=0;i<NCELL;i++)if(b[i]===0)ms.push({type:'mark',i});
  if(allowRot)for(let r=0;r<ROTS.length;r++)ms.push({type:'rot',r});
  return ms;
}
function applyMove(b,m,who){
  if(m.type==='mark'){const nb=b.slice();nb[m.i]=who;return nb}
  return rotBoard(b,ROTS[m.r]);
}

/* =====================================================
   PART 2 : CPU difficulty
   EASY  — many mistakes
   NORMAL— a few mistakes per game
   HARD  — exactly one mistake per game
   MASTER— no mistakes
   ===================================================== */
const LEVELS={
  EASY:  {noise:6.0, defend:true, threat:true, mistakeRate:0.55, mistakesPerGame:99},
  NORMAL:{noise:2.0, defend:true, threat:true, mistakeRate:0,    mistakesPerGame:4},
  HARD:  {noise:0.6, defend:true, threat:true, mistakeRate:0,    mistakesPerGame:1},
  MASTER:{noise:0,   defend:true, threat:true, mistakeRate:0,    mistakesPerGame:0}
};
let mistakesLeft=99;
function heuristic(b){
  const W=[0,1,6,40];let s=0;
  for(const l of LINES){
    let c=0,p=0;
    for(const i of l){if(b[i]===2)c++;else if(b[i]===1)p++}
    if(p===0&&c>0)s+=W[c];
    else if(c===0&&p>0)s-=W[p]*1.15;
  }
  return s;
}
function countThreats(b,who){
  let n=0;
  for(const l of LINES){
    let mine=0,empty=0,other=0;
    for(const i of l){
      if(b[i]===who)mine++;
      else if(b[i]===0)empty++;
      else other++;
    }
    if(mine===2&&empty===1&&other===0)n++;
  }
  return n;
}
function countWins(b,who){
  const want=who===1?'P':'C';let n=0;
  for(const m of genMoves(b))if(outcome(applyMove(b,m,who))===want)n++;
  return n;
}
function scoreMove(b,m,L){
  const nb=applyMove(b,m,2);
  const o=outcome(nb);
  if(o==='C')return 10000;
  if(o==='P')return -10000;
  if(o==='D')return -5;
  let s=heuristic(nb);
  const myThreats0=countThreats(b,2),yourThreats0=countThreats(b,1);
  const yourThreats=countThreats(nb,1),myThreats=countThreats(nb,2);
  if(L.defend&&countWins(nb,1)>0)s-=800;
  if(L.defend&&yourThreats0>0){
    const broken=yourThreats0-yourThreats;
    if(broken>0)s+=180*broken;
    if(yourThreats>0)s-=120*yourThreats;
  }else if(yourThreats>0)s-=100*yourThreats;
  if(L.threat){
    s+=Math.min(countWins(nb,2),3)*8;
    if(myThreats>myThreats0)s+=90*(myThreats-myThreats0);
    s+=myThreats*12;
  }
  if(m.type==='mark')s+=LINE_COUNT[m.i]*0.25;
  else{
    const same=nb.every((v,i)=>v===b[i]);
    if(same)s-=20;
    else{
      if(yourThreats0>0&&yourThreats<yourThreats0)s+=70;
      if(myThreats>myThreats0)s+=55;
      if(yourThreats0===0&&myThreats0===0&&myThreats===0)s-=4;
    }
  }
  return s;
}
function cpuChoose(b,levelName){
  const L=LEVELS[levelName]||LEVELS.EASY;
  const moves=genMoves(b,cpuMarkLeft>0,cpuRotLeft>0);
  if(!moves.length)return null;
  // score all moves
  const ranked=moves.map(m=>({m,s:scoreMove(b,m,L)+Math.random()*L.noise}))
    .sort((a,b)=>b.s-a.s);
  const best=ranked[0];
  // forced: take win, or only move
  if(best.s>=10000||ranked.length===1)return best.m;
  // decide whether to intentionally miss (never miss a direct win)
  let doMiss=false;
  if(levelName==='EASY'&&Math.random()<L.mistakeRate)doMiss=true;
  else if(mistakesLeft>0&&(levelName==='NORMAL'||levelName==='HARD')){
    // spend a planned mistake on non-critical turns
    if(best.s<500&&Math.random()<(levelName==='HARD'?0.35:0.45))doMiss=true;
  }
  if(!doMiss)return best.m;
  // pick a weaker move (not the absolute worst if possible)
  mistakesLeft=Math.max(0,mistakesLeft-1);
  const pool=ranked.slice(1,Math.min(ranked.length,levelName==='EASY'?8:4));
  if(!pool.length)return best.m;
  return pool[Math.floor(Math.random()*pool.length)].m;
}

/* =====================================================
   PART 3 : VIEW (canvas 3D) + CONTROL
   ===================================================== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,S=60,CX=0,CY=0;
const D=10,F_OF=()=>D*S;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layoutCube();
}
function layoutCube(){
  CX=W/2;
  // state may be unset during first parse — treat as title
  const onTitle=(typeof state==='undefined'||state==='title');
  if(onTitle){
    S=Math.min(W*0.92,H*0.5)/5.8;
    CY=H*0.44;
  }else{
    S=Math.min(W,H*0.82)/6.6;
    CY=H*(W<H?0.48:0.50);
  }
}
addEventListener('resize',resize);

const ACC='#e5322d',BODY='#262626';
const TINT=['#dedede','#cdcdcd','#e9e9e9','#c2c2c2','#d6d6d6','#bbbbbb'];
let cubies=[];
function resetCubies(){
  cubies=[];
  for(let i=0;i<27;i++){
    const p=POS[i],st=[];
    for(let ax=0;ax<3;ax++)if(p[ax]!==0){
      const n=[0,0,0];n[ax]=p[ax];
      st.push({n,tint:TINT[ax*2+(p[ax]>0?0:1)],owner:0,mt:-1});
    }
    cubies.push({id:i,pos:p.slice(),M:[1,0,0,0,1,0,0,0,1],st});
  }
}
resetCubies();
const slotOfSt=(c,s)=>slotOf(c.pos,rnd(mulV(c.M,s.n)));
function boardNow(){const b=new Array(NCELL).fill(0);for(const c of cubies)for(const s of c.st)b[slotOfSt(c,s)]=s.owner;return b}
function stickerMap(){const m=[];for(const c of cubies)for(const s of c.st)m[slotOfSt(c,s)]=s;return m}

/* free view: a rotation matrix we turn around the screen axes (no limits) */
function orth(M){
  const nz=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l]};
  let a=nz([M[0],M[1],M[2]]),b=[M[3],M[4],M[5]];
  const d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  b=nz([b[0]-d*a[0],b[1]-d*a[1],b[2]-d*a[2]]);
  const c=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  return [...a,...b,...c];
}
/* Front-facing pose: slight tilt so top and right faces are visible */
function frontView(){return orth(mulM(rotM(0,0.42),rotM(1,-0.55)))}
let userView=frontView();
function orbit(dx,dy){userView=orth(mulM(mulM(rotM(0,dy*.008),rotM(1,dx*.008)),userView))}

/* state */
let state='title';       // title | player | busy | cpu | over
resize(); // initial layout after state exists
let mode='MARK';         // MARK | ROTATE (what YOU chose)
let round=1,anim=null,hl=null,hoverSt=null,level='EASY';
let playMode='cpu';       // cpu | pvp
let rotLeft=30;          // player rotate budget per game (max 30)
const ROT_MAX=30;
const MARK_MAX=7;
const SECOND_MARK_BONUS=2; // A1: second player gets extra marks
let humanFirst=true;     // who opens the game (random each start)
let markLeft=MARK_MAX;
let cpuMarkLeft=MARK_MAX+SECOND_MARK_BONUS;
let cpuRotLeft=ROT_MAX;
let rotatedThisTurn=false; // true after at least one rotate this turn
let turnHist=[];           // undo stack for CURRENT turn only (rotates)
let hits=[];

/* ---------- multiplayer (PeerJS) ---------- */
const PEER_OPTS={
  debug:1,
  config:{iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'},
    {urls:'stun:stun.cloudflare.com:3478'},
    {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
  ]}
};
let peer=null,conn=null,isHost=false,roomCode='',netStarted=false;
function netSend(msg){
  if(conn&&conn.open){try{conn.send(msg)}catch(e){console.warn('send',e)}}
}
function netDestroy(){
  netStarted=false;
  try{if(conn){conn.close()}}catch(e){}
  conn=null;
  try{if(peer){peer.destroy()}}catch(e){}
  peer=null;isHost=false;roomCode='';
}
function setNetWait(show,msg,code){
  const el=document.getElementById('netwait');
  if(!el)return;
  el.classList.toggle('hidden',!show);
  if(msg!=null){const m=document.getElementById('netMsg');if(m)m.textContent=msg}
  if(code!=null){const c=document.getElementById('netCode');if(c)c.textContent=code}
}
function whenOpen(c,fn){
  let done=false;
  const go=()=>{if(done)return;done=true;try{fn()}catch(e){console.error(e)}};
  if(c.open)go();
  else c.on('open',go);
}
function wireConn(c){
  conn=c;
  c.on('data',onNetData);
  c.on('close',()=>{
    if(state!=='title'&&state!=='over'){
      setNetWait(true,'DISCONNECTED','');
      setTimeout(()=>{setNetWait(false);toTitle()},1200);
    }else if(!netStarted&&isHost){
      setNetWait(false);netDestroy();
      const s=document.getElementById('titleStatus');
      if(s)s.textContent='PLAYER LEFT';
    }
  });
  c.on('error',e=>console.warn('conn error',e));
}
function bootGameFromNet(asHost,hostIsFirst){
  if(netStarted)return;
  netStarted=true;
  humanFirst=asHost?!!hostIsFirst:!hostIsFirst;
  assignSeatsFromFlags();
  document.getElementById('title').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  setNetWait(false);
  resetCubies();hl=null;anim=null;round=1;mode='MARK';hoverSt=null;
  rotatedThisTurn=false;clearTurnHist();userView=frontView();
  document.getElementById('result').classList.add('hidden');
  ['turn','modes','hint','legend'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
  showDealKnown();
}
function onNetData(msg){
  if(!msg||!msg.type)return;
  if(msg.type==='start'){
    bootGameFromNet(false,!!msg.hostIsFirst);
    return;
  }
  if(msg.type==='ping'){netSend({type:'pong'});return}
  if(msg.type==='pong')return;
  if(state==='title'||state==='over')return;
  if(msg.type==='mark'){
    const st=stickerMap()[msg.i];
    if(!st||st.owner!==0)return;
    state='busy';
    cpuMarkLeft=Math.max(0,cpuMarkLeft-1);
    st.owner=2;st.mt=performance.now();SND.mark();
    setTimeout(()=>finishMove(2),400);
  }else if(msg.type==='rot'){
    state='busy';
    cpuRotLeft=Math.max(0,cpuRotLeft-1);
    startRot(msg.axis,msg.layer,msg.dir,()=>setTimeout(()=>finishMove(2),120));
  }else if(msg.type==='end'){
    state='busy';
    setTimeout(()=>finishMove(2),200);
  }
}
function assignSeatsFromFlags(){
  if(humanFirst){markLeft=MARK_MAX;cpuMarkLeft=MARK_MAX+SECOND_MARK_BONUS}
  else{markLeft=MARK_MAX+SECOND_MARK_BONUS;cpuMarkLeft=MARK_MAX}
  rotLeft=ROT_MAX;cpuRotLeft=ROT_MAX;
}
function genRoomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';for(let i=0;i<6;i++)s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function hostStartGame(){
  const hostIsFirst=Math.random()<0.5;
  setNetWait(true,'STARTING…',roomCode);
  netSend({type:'start',hostIsFirst});
  setTimeout(()=>bootGameFromNet(true,hostIsFirst),120);
}
function makePeer(id){
  // default PeerJS cloud (omit host → uses built-in 0.peerjs.com)
  return id?new Peer(id,PEER_OPTS):new Peer(PEER_OPTS);
}
function startHost(code){
  if(typeof Peer==='undefined'){
    const s=document.getElementById('titleStatus');
    if(s)s.textContent='NETWORK LIBRARY MISSING';
    return;
  }
  netDestroy();
  playMode='pvp';isHost=true;roomCode=code;
  setNetWait(true,'CONNECTING TO SERVER…',code);
  try{peer=makePeer('ttr-'+code)}catch(e){
    setNetWait(true,'PEER CREATE FAILED','');
    return;
  }
  peer.on('open',()=>{
    setNetWait(true,'WAITING FOR PLAYER',code);
  });
  peer.on('connection',c=>{
    setNetWait(true,'PLAYER FOUND…',code);
    wireConn(c);
    whenOpen(c,()=>{
      setNetWait(true,'LINKED — STARTING',code);
      hostStartGame();
    });
  });
  peer.on('error',err=>{
    const t=(err&&err.type)||String(err);
    console.error('host peer error',err);
    if(t==='unavailable-id'){
      setNetWait(true,'CODE IN USE — JOIN INSTEAD',code);
    }else{
      setNetWait(true,'HOST ERROR: '+t,code);
    }
    setTimeout(()=>{setNetWait(false);netDestroy()},2500);
  });
  peer.on('disconnected',()=>{
    if(!netStarted)try{peer.reconnect()}catch(e){}
  });
}
function startJoin(code){
  if(typeof Peer==='undefined'){
    const s=document.getElementById('titleStatus');
    if(s)s.textContent='NETWORK LIBRARY MISSING';
    return;
  }
  netDestroy();
  playMode='pvp';isHost=false;roomCode=code;
  setNetWait(true,'CONNECTING TO SERVER…',code);
  try{peer=makePeer()}catch(e){
    setNetWait(true,'PEER CREATE FAILED','');
    return;
  }
  let tries=0,curFail=null;
  const tryConnect=()=>{
    if(!peer||netStarted)return;
    tries++;
    setNetWait(true,tries===1?'JOINING ROOM':'RETRY '+tries+'/12',code);
    let settled=false;
    const c=peer.connect('ttr-'+code,{reliable:true,serialization:'json'});
    const fail=why=>{
      if(settled||netStarted)return;
      settled=true;
      try{c.close()}catch(e){}
      console.warn('join fail',why);
      if(tries<12)setTimeout(tryConnect,800);
      else{
        setNetWait(true,'CANNOT JOIN — HOST FIRST?',code);
        setTimeout(()=>{setNetWait(false);netDestroy()},3000);
      }
    };
    curFail=fail;
    const timer=setTimeout(()=>fail('timeout'),5000);
    c.on('open',()=>{
      if(settled)return;settled=true;clearTimeout(timer);
      wireConn(c);
      setNetWait(true,'CONNECTED — WAITING',code);
      netSend({type:'ping'});
    });
    c.on('error',e=>fail(e));
  };
  peer.on('open',()=>{
    setNetWait(true,'JOINING ROOM',code);
    tryConnect();
  });
  peer.on('error',err=>{
    console.error('join peer error',err);
    if(err&&err.type==='peer-unavailable'&&curFail){curFail('unavailable');return}
    setNetWait(true,'JOIN ERROR: '+((err&&err.type)||err),'');
    setTimeout(()=>{setNetWait(false);netDestroy()},2500);
  });
}
const ONLINE_ROOM='OLLOBBY';
function startOnline(){
  if(typeof Peer==='undefined'){
    const s=document.getElementById('titleStatus');
    if(s)s.textContent='NETWORK LIBRARY MISSING';
    return;
  }
  netDestroy();
  playMode='pvp';
  onlineTry(0);
}
function onlineTry(tries){
  const room=ONLINE_ROOM;
  if(tries>=10){
    setNetWait(true,'NO MATCH — TRY AGAIN','');
    setTimeout(()=>{setNetWait(false);netDestroy()},2000);
    return;
  }
  netDestroy();
  playMode='pvp';roomCode=room;
  setNetWait(true,tries?'MATCHING… '+(tries+1):'MATCHING…',room);
  let p;
  try{p=makePeer()}catch(e){setNetWait(true,'PEER CREATE FAILED','');return}
  peer=p;
  let settled=false,timer=null;
  const finish=()=>{settled=true;clearTimeout(timer)};
  const retryLater=()=>setTimeout(()=>onlineTry(tries+1),300+Math.random()*700);
  // nobody is hosting the lobby yet -> become the host
  const hostNow=()=>{
    if(settled)return;
    finish();
    try{p.destroy()}catch(e){}
    if(peer===p)peer=null;
    let h;
    try{h=makePeer('ttr-'+room)}catch(e){setNetWait(true,'PEER CREATE FAILED','');return}
    peer=h;isHost=true;
    setNetWait(true,'WAITING FOR PLAYER',room);
    h.on('connection',c=>{
      if(netStarted){try{c.close()}catch(e){}return}
      setNetWait(true,'PLAYER FOUND…',room);
      wireConn(c);
      whenOpen(c,()=>{setNetWait(true,'LINKED — STARTING',room);hostStartGame()});
    });
    h.on('error',err=>{
      // someone else grabbed the host slot at the same moment -> join them
      if(err&&err.type==='unavailable-id'){
        try{h.destroy()}catch(e){}
        if(peer===h)peer=null;
        retryLater();
        return;
      }
      setNetWait(true,'MATCH ERROR: '+((err&&err.type)||err),'');
      setTimeout(()=>{setNetWait(false);netDestroy()},2000);
    });
  };
  p.on('open',()=>{
    const c=p.connect('ttr-'+room,{reliable:true,serialization:'json'});
    timer=setTimeout(()=>{
      if(settled)return;
      try{c.close()}catch(e){}
      hostNow();
    },4000);
    c.on('open',()=>{
      if(settled)return;
      finish();
      isHost=false;
      wireConn(c);
      c.on('close',()=>{
        if(!netStarted){
          setNetWait(true,'LOBBY CLOSED','');
          setTimeout(()=>{setNetWait(false);netDestroy()},1500);
        }
      });
      setNetWait(true,'MATCH FOUND',room);
      netSend({type:'ping'});
    });
    c.on('error',()=>{});
  });
  p.on('error',err=>{
    // 'peer-unavailable' = no host exists for this room yet (normal here)
    if(err&&err.type==='peer-unavailable'){hostNow();return}
    setNetWait(true,'MATCH ERROR: '+((err&&err.type)||err),'');
    setTimeout(()=>{setNetWait(false);netDestroy()},2000);
  });
}
function showDealKnown(){
  state='busy';
  const deal=document.getElementById('deal');
  const name=document.getElementById('dealName');
  const sub=document.getElementById('dealSub');
  deal.classList.remove('hidden');void deal.offsetWidth;deal.classList.add('show');
  name.classList.remove('pop');
  name.textContent=humanFirst?'YOU':'OPP';
  sub.textContent=humanFirst?'YOU GO FIRST':'OPP GOES FIRST';
  SND.ui();
  setTimeout(()=>{
    deal.classList.add('hidden');deal.classList.remove('show');
    beginPlay();
  },1400);
}

function cloneCubies(){
  return cubies.map(c=>({
    id:c.id,pos:c.pos.slice(),M:c.M.slice(),
    st:c.st.map(s=>({n:s.n.slice(),tint:s.tint,owner:s.owner,mt:s.mt}))
  }));
}
/* Snapshot before a rotate within the current turn */
function pushTurnHist(){
  turnHist.push({
    cubies:cloneCubies(),
    rotLeft,rotatedThisTurn,mode
  });
}
function clearTurnHist(){turnHist=[];}
function canUndo(){
  return turnHist.length>0&&state==='player'&&!anim;
}
function doUndo(){
  if(!canUndo())return;
  const s=turnHist.pop();
  cubies=s.cubies;
  rotLeft=s.rotLeft;
  rotatedThisTurn=s.rotatedThisTurn;
  mode=s.mode;
  hl=null;anim=null;hoverSt=null;
  setUI();
  SND.ui();
}

/* ---------- sound ---------- */
let AC=null,soundOn=true;
function tone(f1,f2,dur,type,vol,delay){
  if(!AC||!soundOn)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.03);
}
const SND={
  ui:()=>tone(900,700,.05,'square',.035),
  mark:()=>tone(1300,520,.07,'square',.07),
  rot:()=>{tone(150,70,.3,'sawtooth',.05);[0,.08,.16,.24].forEach(d=>tone(320,180,.03,'square',.035,d))},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f*1.01,.13,'triangle',.09,i*.09)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,f*.98,.16,'triangle',.09,i*.12))
};

/* ---------- 3D helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeBack=t=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
let VM=null;
function proj(P){
  const v=mulV(VM,P),k=F_OF()/(D-v[2]);
  return [CX+v[0]*k,CY-v[1]*k,k,v];
}
function quad(fc,u,v,h,off){
  const c=off?[fc[0]+off[0],fc[1]+off[1],fc[2]+off[2]]:fc;
  return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>
    proj([c[0]+h*(a*u[0]+b*v[0]),c[1]+h*(a*u[1]+b*v[1]),c[2]+h*(a*u[2]+b*v[2])]));
}
function poly(pts,fill,stroke,lw){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.lineJoin='round';ctx.stroke()}
}
function glyph(kind,fc,u,v,nw,prog,col){
  const lift=[fc[0]+nw[0]*.004,fc[1]+nw[1]*.004,fc[2]+nw[2]*.004];
  const k=proj(lift)[2];
  ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineWidth=Math.max(2,k*.085*Math.min(1,prog+.2));
  ctx.beginPath();
  if(kind===1){
    const r=.29*prog;
    for(let i=0;i<=36;i++){
      const t=i/36*Math.PI*2,c=Math.cos(t)*r,s=Math.sin(t)*r;
      const p=proj([lift[0]+c*u[0]+s*v[0],lift[1]+c*u[1]+s*v[1],lift[2]+c*u[2]+s*v[2]]);
      i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);
    }
  }else{
    const r=.27*prog;
    for(const sg of [1,-1]){
      const a=proj([lift[0]+r*(u[0]+sg*v[0]),lift[1]+r*(u[1]+sg*v[1]),lift[2]+r*(u[2]+sg*v[2])]);
      const b=proj([lift[0]-r*(u[0]+sg*v[0]),lift[1]-r*(u[1]+sg*v[1]),lift[2]-r*(u[2]+sg*v[2])]);
      ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
    }
  }
  ctx.stroke();
}

/* ---------- drawing ---------- */
function draw(now){
  ctx.clearRect(0,0,W,H);
  VM=userView;
  const faces=[],cam=[0,0,D];
  for(const c of cubies){
    let R=null;
    if(anim&&c.pos[anim.axis]===anim.layer)R=rotM(anim.axis,anim.ang);
    const cen=R?mulV(R,c.pos):c.pos,Mw=R?mulM(R,c.M):c.M;
    for(let ax=0;ax<3;ax++)for(const sg of [-1,1]){
      const nl=[0,0,0];nl[ax]=sg;
      const nw=mulV(Mw,nl);
      const fc=[cen[0]+nw[0]*.5,cen[1]+nw[1]*.5,cen[2]+nw[2]*.5];
      const fv=mulV(VM,fc),nv=mulV(VM,nw);
      if(nv[0]*(cam[0]-fv[0])+nv[1]*(cam[1]-fv[1])+nv[2]*(cam[2]-fv[2])<=0)continue;
      faces.push({c,nw,fc,u:mulV(Mw,AX[(ax+1)%3]),v:mulV(Mw,AX[(ax+2)%3]),
        dist:fv[0]*fv[0]+fv[1]*fv[1]+(D-fv[2])*(D-fv[2]),
        st:c.st.find(s=>s.n[ax]===sg)});
    }
  }
  faces.sort((a,b)=>b.dist-a.dist);
  hits=[];
  const pulse=.5+.5*Math.sin(now/170);
  for(const f of faces){
    poly(quad(f.fc,f.u,f.v,.5),BODY,BODY,1.2);
    const st=f.st;
    if(!st)continue;
    const off=[f.nw[0]*.003,f.nw[1]*.003,f.nw[2]*.003];
    const sp=quad(f.fc,f.u,f.v,.43,off);
    const win=hl&&hl.has(st);
    let fill=st.tint,mc='#000';
    if(st.owner===1){fill='#fff';mc='#000'}
    else if(st.owner===2){fill='#050505';mc='#fff'}
    if(win){fill=pulse>.5?ACC:'#c42a25';mc='#fff'}
    poly(sp,fill,st.owner===2&&!win?'#4a4a4a':null,1.5);
    if(st.owner>0){
      const prog=st.mt<0?1:easeBack(clamp((now-st.mt)/300,0,1));
      glyph(st.owner,f.fc,f.u,f.v,f.nw,Math.max(.01,prog),mc);
    }else if(hoverSt===st&&mode==='MARK'&&markLeft>0&&state==='player'&&!anim){
      ctx.globalAlpha=.4;glyph(1,f.fc,f.u,f.v,f.nw,1,'#000');ctx.globalAlpha=1;
    }
    hits.push({poly:sp,c:f.c,st,nw:rnd(f.nw)});
  }
}
function inPoly(p,x,y){
  let ins=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++){
    const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];
    if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins;
  }
  return ins;
}
function hitTest(x,y){
  for(let i=hits.length-1;i>=0;i--)if(inPoly(hits[i].poly,x,y))return hits[i];
  return null;
}

/* ---------- rotation animation ---------- */
function startRot(axis,layer,dir,done){
  anim={axis,layer,dir,t0:performance.now(),dur:430,ang:0,done};
  SND.rot();
}
function updateAnim(now){
  if(!anim)return;
  const t=clamp((now-anim.t0)/anim.dur,0,1);
  anim.ang=anim.dir*(Math.PI/2)*ease(t);
  if(t>=1){
    const R=rotM(anim.axis,anim.dir*Math.PI/2),a=anim;
    for(const c of cubies)if(c.pos[a.axis]===a.layer){c.pos=rnd(mulV(R,c.pos));c.M=rnd(mulM(R,c.M))}
    anim=null;
    a.done&&a.done();
  }
}

/* ---------- turn flow ---------- */
const $=id=>document.getElementById(id);
let lastWho=2;
function setUI(){
  const mine=state==='player';
  const opp=playMode==='pvp'?'OPP':'CPU';
  const oppTurn=opp+' TURN';
  $('turn').textContent=state==='over'?'':(mine||(state==='busy'&&lastWho===2)?'YOUR TURN':oppTurn);
  if(state==='busy'&&lastWho===1)$('turn').textContent=oppTurn;
  if(state==='busy'&&lastWho===2)$('turn').textContent='YOUR TURN';
  const cpuWho=document.querySelector('#legend .who.cpu');
  if(cpuWho)cpuWho.textContent=opp;
  const can=state==='player';
  const canMark=can&&markLeft>0;
  const canRot=can&&rotLeft>0;
  // auto-switch mode when current choice is exhausted
  if(can&&mode==='MARK'&&!canMark&&canRot)mode='ROTATE';
  if(can&&mode==='ROTATE'&&!canRot&&canMark)mode='MARK';
  $('mMark').disabled=!canMark;
  $('mRot').disabled=!canRot;
  $('mMark').classList.toggle('on',mode==='MARK'&&canMark);
  $('mRot').classList.toggle('on',mode==='ROTATE'&&canRot);
  // END TURN: after rotate, or when no marks left (must rotate/end)
  const endBtn=$('mEnd');
  if(endBtn){
    const showEnd=can&&(rotatedThisTurn||(markLeft<=0&&rotLeft<=0));
    endBtn.classList.toggle('hidden',!showEnd);
    endBtn.disabled=!showEnd;
  }
  if(!can){
    $('hint').textContent='';
  }else if(markLeft<=0&&rotLeft<=0){
    $('hint').textContent='No moves left. End turn.';
  }else if(mode==='MARK'&&canMark){
    $('hint').textContent=rotatedThisTurn?'Place your mark, or end turn.':'Place your mark.';
  }else if(mode==='ROTATE'&&canRot){
    $('hint').textContent=rotatedThisTurn?'Rotate more, or end turn.':'Drag a face to rotate.';
  }else if(markLeft<=0){
    $('hint').textContent='No marks left. Rotate only.';
  }else{
    $('hint').textContent='No rotates left. Place a mark.';
  }
  const setStat=(id,label,n,lowAt)=>{
    const el=$(id);if(!el)return;
    el.textContent=label+' '+n;
    el.classList.toggle('low',n<=lowAt);
  };
  setStat('pRound','ROUND',round,0);
  setStat('cRound','ROUND',round,0);
  setStat('pMarks','MARK',markLeft,2);
  setStat('cMarks','MARK',cpuMarkLeft,2);
  setStat('pRots','ROTATE',rotLeft,5);
  setStat('cRots','ROTATE',cpuRotLeft,5);
  const undoBtn=$('undo');
  if(undoBtn)undoBtn.disabled=!canUndo();
  cv.style.cursor=can?(mode==='MARK'&&canMark?'default':(mode==='ROTATE'&&canRot?'grab':'default')):'default';
}
function finishMove(who){
  lastWho=who;
  clearTurnHist();
  const b=boardNow(),o=outcome(b);
  if(o){endGame(o,b);return}
  if(who===1){
    if(!humanFirst)round++;
    state='cpu';rotatedThisTurn=false;setUI();
    if(playMode==='cpu')setTimeout(cpuTurn,650);
    // pvp: wait for opponent messages
  }else{
    if(humanFirst)round++;
    state='player';rotatedThisTurn=false;
    mode=markLeft>0?'MARK':(rotLeft>0?'ROTATE':'MARK');
    setUI();
    if(markLeft<=0&&rotLeft<=0)setTimeout(()=>endPlayerTurn(true),300);
  }
}
function cpuTurn(){
  if(state!=='cpu'||playMode!=='cpu')return;
  const m=cpuChoose(boardNow(),level);
  if(!m){setTimeout(()=>finishMove(2),200);return}
  state='busy';lastWho=1;setUI();
  if(m.type==='mark'){
    cpuMarkLeft=Math.max(0,cpuMarkLeft-1);
    const st=stickerMap()[m.i];st.owner=2;st.mt=performance.now();SND.mark();
    setTimeout(()=>finishMove(2),420);
  }else{
    cpuRotLeft=Math.max(0,cpuRotLeft-1);
    const r=ROTS[m.r];
    startRot(r.axis,r.layer,r.dir,()=>setTimeout(()=>finishMove(2),120));
  }
}
function doPlayerMark(st){
  if(markLeft<=0)return;
  clearTurnHist();
  state='busy';lastWho=2;
  markLeft--;
  // find slot index for net sync
  let slot=-1;const map=stickerMap();
  for(let i=0;i<NCELL;i++)if(map[i]===st){slot=i;break}
  st.owner=1;st.mt=performance.now();SND.mark();setUI();
  if(playMode==='pvp')netSend({type:'mark',i:slot});
  setTimeout(()=>finishMove(1),400);
}
function doPlayerRot(r){
  if(rotLeft<=0)return;
  pushTurnHist();
  state='busy';lastWho=2;setUI();
  rotLeft--;
  rotatedThisTurn=true;
  if(playMode==='pvp')netSend({type:'rot',axis:r.axis,layer:r.layer,dir:r.dir});
  startRot(r.axis,r.layer,r.dir,()=>{
    const b=boardNow(),o=outcome(b);
    if(o){endGame(o,b);return}
    state='player';
    if(rotLeft<=0&&markLeft>0)mode='MARK';
    setUI();
  });
}
function endPlayerTurn(force){
  if(state!=='player')return;
  if(!force&&!rotatedThisTurn&&!(markLeft<=0&&rotLeft<=0))return;
  clearTurnHist();
  state='busy';lastWho=2;setUI();
  if(playMode==='pvp')netSend({type:'end'});
  setTimeout(()=>finishMove(1),200);
}
function endGame(o,b){
  state='over';
  hl=new Set();
  const want=o==='P'?[1]:o==='C'?[2]:[1,2],map=stickerMap();
  for(const l of LINES){
    const a=b[l[0]];
    if(a&&a===b[l[1]]&&a===b[l[2]]&&want.includes(a))l.forEach(i=>hl.add(map[i]));
  }
  setUI();
  $('turn').classList.add('hidden');$('modes').classList.add('hidden');$('hint').classList.add('hidden');$('legend').classList.add('hidden');
  if($('mEnd'))$('mEnd').classList.add('hidden');
  setTimeout(()=>{
    $('rtext').textContent=o==='P'?'YOU WIN':o==='C'?'YOU LOSE':'DRAW';
    $('rtext').classList.remove('small');
    $('rbtns').classList.remove('show');
    $('result').classList.remove('hidden');
    if(o==='P')SND.win();else if(o==='C')SND.lose();else SND.ui();
    setTimeout(()=>{$('rtext').classList.add('small');$('rbtns').classList.add('show')},1500);
  },o==='D'?400:700);
}

function assignSeats(){
  humanFirst=Math.random()<0.5;
  // A1: second player gets mark bonus
  if(humanFirst){
    markLeft=MARK_MAX;
    cpuMarkLeft=MARK_MAX+SECOND_MARK_BONUS;
  }else{
    markLeft=MARK_MAX+SECOND_MARK_BONUS;
    cpuMarkLeft=MARK_MAX;
  }
  rotLeft=ROT_MAX;cpuRotLeft=ROT_MAX;
}
function beginPlay(){
  $('deal').classList.add('hidden');$('deal').classList.remove('show');
  if(humanFirst){
    state='player';lastWho=2;mode=markLeft>0?'MARK':'ROTATE';
    layoutCube();setUI();
  }else{
    state='cpu';lastWho=1;mode='MARK';
    layoutCube();setUI();
    if(playMode==='cpu')setTimeout(cpuTurn,700);
  }
}
function showDealThenStart(){
  state='busy';
  assignSeats();
  const oppLabel=playMode==='pvp'?'OPP':'CPU';
  const deal=$('deal'),name=$('dealName'),sub=$('dealSub');
  deal.classList.remove('hidden');
  void deal.offsetWidth;
  deal.classList.add('show');
  name.classList.remove('pop');
  name.textContent='···';
  sub.textContent='';
  SND.ui();
  let n=0;
  const flick=setInterval(()=>{
    name.textContent=n%2===0?'YOU':oppLabel;
    n++;
    if(n>8){
      clearInterval(flick);
      name.textContent=humanFirst?'YOU':oppLabel;
      name.classList.add('pop');
      sub.textContent=humanFirst?'YOU GO FIRST':(oppLabel+' GOES FIRST');
      SND.ui();
      setTimeout(beginPlay,1100);
    }
  },90);
}
function newGame(){
  resetCubies();hl=null;anim=null;round=1;mode='MARK';hoverSt=null;
  rotatedThisTurn=false;clearTurnHist();
  userView=frontView();
  const L=LEVELS[level]||LEVELS.EASY;
  mistakesLeft=L.mistakesPerGame;
  $('result').classList.add('hidden');
  $('turn').classList.remove('hidden');$('modes').classList.remove('hidden');$('hint').classList.remove('hidden');$('legend').classList.remove('hidden');
  if($('mEnd'))$('mEnd').classList.add('hidden');
  layoutCube();
  showDealThenStart();
}
function toTitle(){
  netDestroy();
  playMode='cpu';
  resetCubies();hl=null;anim=null;state='title';
  $('result').classList.add('hidden');
  $('deal').classList.add('hidden');$('deal').classList.remove('show');
  setNetWait(false);
  $('game').classList.add('hidden');$('title').classList.remove('hidden');
  $('localBox').classList.add('hidden');
  $('titleStatus').textContent='';
  layoutCube();
}

/* ---------- rotate-by-drag: which slice, which way ---------- */
function solveRot(h,d){
  const n=h.nw,nIdx=n.findIndex(v=>v!==0),pos=h.c.pos;
  const fc=[pos[0]+n[0]*.5,pos[1]+n[1]*.5,pos[2]+n[2]*.5],a=proj(fc);
  let best=null,bs=0;
  for(let t=0;t<3;t++){
    if(t===nIdx)continue;
    const b=proj([fc[0]+AX[t][0],fc[1]+AX[t][1],fc[2]+AX[t][2]]);
    const sd=[b[0]-a[0],b[1]-a[1]],len=Math.hypot(sd[0],sd[1]);
    if(len<1e-6)continue;
    const dot=(d[0]*sd[0]+d[1]*sd[1]),sc=Math.abs(dot)/len;
    if(sc>bs){bs=sc;best={t,sign:dot>=0?1:-1}}
  }
  if(!best)return null;
  const tvec=AX[best.t].map(v=>v*best.sign);
  const u=3-nIdx-best.t,uvec=AX[u];
  const cr=[uvec[1]*n[2]-uvec[2]*n[1],uvec[2]*n[0]-uvec[0]*n[2],uvec[0]*n[1]-uvec[1]*n[0]];
  const s=cr[0]*tvec[0]+cr[1]*tvec[1]+cr[2]*tvec[2]>0?1:-1;
  return {axis:u,layer:pos[u],dir:s};
}

/* ---------- pointer input ---------- */
let down=null;
const canAct=()=>state==='player'&&!anim;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  if(state==='title'){down={mode:'orbit',lx:e.clientX,ly:e.clientY};return}
  down={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,hit:hitTest(e.clientX,e.clientY),mode:null};
});
cv.addEventListener('pointermove',e=>{
  if(!down){
    const h=hitTest(e.clientX,e.clientY);
    hoverSt=(h&&h.st.owner===0&&markLeft>0)?h.st:null;
    cv.style.cursor=!canAct()?'default':(h?(mode==='MARK'&&markLeft>0?(hoverSt?'pointer':'default'):(mode==='ROTATE'&&rotLeft>0?'grab':'default')):'default');
    return;
  }
  if(!down.mode){
    const dx=e.clientX-down.x,dy=e.clientY-down.y;
    if(Math.hypot(dx,dy)<=10)return;
    if(mode==='ROTATE'&&canAct()&&down.hit){
      const r=solveRot(down.hit,[dx,dy]);
      if(r){down.mode='rot';hoverSt=null;doPlayerRot(r);return}
    }
    down.mode='orbit';down.lx=e.clientX;down.ly=e.clientY;hoverSt=null;return;
  }
  if(down.mode==='orbit'){
    orbit(e.clientX-down.lx,e.clientY-down.ly);
    down.lx=e.clientX;down.ly=e.clientY;
  }
});
cv.addEventListener('pointerup',e=>{
  if(down&&!down.mode&&mode==='MARK'&&markLeft>0&&canAct()){
    const h=hitTest(e.clientX,e.clientY);
    if(h&&h.st.owner===0)doPlayerMark(h.st);
  }
  down=null;
});
cv.addEventListener('pointercancel',()=>{down=null});
cv.addEventListener('pointerleave',()=>{if(!down)hoverSt=null});

/* ---------- buttons ---------- */
function ensureAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function startCpu(lv){
  ensureAudio();SND.ui();
  playMode='cpu';level=lv;netDestroy();
  $('title').classList.add('hidden');$('game').classList.remove('hidden');
  newGame();
}
$('lvEASY').onclick=()=>startCpu('EASY');
$('lvNORMAL').onclick=()=>startCpu('NORMAL');
$('lvHARD').onclick=()=>startCpu('HARD');
$('lvMASTER').onclick=()=>startCpu('MASTER');
$('btnLocal').onclick=()=>{
  ensureAudio();SND.ui();
  $('localBox').classList.remove('hidden');
  $('titleStatus').textContent='ENTER A 6-LETTER CODE';
  $('roomInput').value='';$('roomInput').focus();
};
$('btnLocalCancel').onclick=()=>{
  $('localBox').classList.add('hidden');$('titleStatus').textContent='';
};
$('btnHost').onclick=()=>{
  ensureAudio();SND.ui();
  let code=($('roomInput').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  if(code.length<4){code=genRoomCode();$('roomInput').value=code}
  startHost(code);
};
$('btnJoin').onclick=()=>{
  ensureAudio();SND.ui();
  const code=($('roomInput').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  if(code.length<4){$('titleStatus').textContent='CODE TOO SHORT';return}
  startJoin(code);
};
$('btnOnline').onclick=()=>{ensureAudio();SND.ui();startOnline()};
$('netCancel').onclick=()=>{netDestroy();setNetWait(false);$('titleStatus').textContent=''};
$('mMark').onclick=()=>{if(state!=='player'||markLeft<=0)return;mode='MARK';SND.ui();setUI()};
$('mRot').onclick=()=>{if(state!=='player'||rotLeft<=0)return;mode='ROTATE';SND.ui();setUI()};
$('mEnd').onclick=()=>{if(state!=='player')return;SND.ui();endPlayerTurn()};
$('undo').onclick=()=>doUndo();
$('back').onclick=()=>{SND.ui();toTitle()};
$('back2').onclick=()=>{SND.ui();toTitle()};
$('restart').onclick=()=>{
  SND.ui();
  if(playMode==='pvp')toTitle();
  else newGame();
};
$('snd').onclick=()=>{soundOn=!soundOn;$('snd').textContent=soundOn?'SOUND ON':'SOUND OFF';SND.ui()};
addEventListener('keydown',e=>{
  if(state!=='player')return;
  if((e.key==='m'||e.key==='M')&&markLeft>0){mode='MARK';SND.ui();setUI()}
  if((e.key==='r'||e.key==='R')&&rotLeft>0){mode='ROTATE';SND.ui();setUI()}
});

/* ---------- main loop ---------- */
let prev=performance.now();
function loop(now){
  const dt=Math.min(50,now-prev);prev=now;
  if(state==='title'&&!(down&&down.mode))userView=orth(mulM(rotM(1,dt*.0004),userView));
  updateAnim(now);
  draw(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
